<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>할로우핀체인 검색</title>

    <link rel="manifest" href="../../../manifest.json">
    <meta name="theme-color" content="#3e8aae">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        :root {
            --accent-main: rgb(62, 138, 174);
            --accent-soft: rgba(62, 138, 174, 0.15);
            --accent-border: rgba(62, 138, 174, 0.34);
            --bg-top: #e8f5fb;
            --bg-bottom: #d7ebf4;
            --text-main: #133241;
            --text-sub: rgba(19, 50, 65, 0.72);
            --panel-bg: rgba(62, 138, 174, 0.08);
            --panel-border: rgba(62, 138, 174, 0.22);
            --input-bg: rgba(255, 255, 255, 0.58);
            --btn-bg: rgba(62, 138, 174, 0.16);
            --btn-border: rgba(62, 138, 174, 0.28);
            --btn-hover-bg: var(--accent-main);
            --btn-hover-text: #ffffff;
            --home-btn-bg: rgba(62, 138, 174, 0.12);
            --home-btn-border: rgba(62, 138, 174, 0.35);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            background:
                radial-gradient(circle at top, rgba(62, 138, 174, 0.25), transparent 55%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            display: flex;
            justify-content: center;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .page {
            max-width: 800px;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0 0 10px;
        }

        .top-bar {
            position: relative;
            height: 86px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(232, 245, 251, 0.74);
            border-bottom: 1px solid rgba(62, 138, 174, 0.12);
        }

        .hamburger-btn {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            border: 0;
            background: transparent;
            color: var(--text-main);
            font-size: 1.55rem;
            font-weight: 900;
            cursor: pointer;
            line-height: 1;
            padding: 0;
        }

        .title-pill {
            min-height: 44px;
            padding: 7px 18px;
            border-radius: 17px;
            border: 1px solid var(--accent-border);
            background: rgba(62, 138, 174, 0.08);
            color: var(--accent-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.55rem;
            font-weight: 900;
            letter-spacing: -0.05em;
            box-shadow: 0 8px 18px rgba(62, 138, 174, 0.10);
            text-align: center;
        }

        .menu-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            border-radius: 18px;
            border: 1px solid var(--accent-border);
            background: rgba(62, 138, 174, 0.09);
            color: var(--accent-main);
            font-size: 0.70rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
        }

        .menu-arrow {
            font-size: 1.25rem;
            line-height: 1;
            margin-bottom: -3px;
        }

        .content {
            flex: 1;
            padding: 24px 16px 0;
            display: flex;
            flex-direction: column;
        }

        .search-panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 22px 20px 18px;
            box-shadow: 0 10px 30px rgba(62, 138, 174, 0.10);
            backdrop-filter: blur(4px);
        }

        .field { margin-bottom: 14px; }

        .field label {
            display: block;
            margin: 0 0 7px;
            font-size: 0.82rem;
            font-weight: 900;
            color: var(--accent-main);
            letter-spacing: -0.02em;
        }

        select {
            width: 100%;
            min-height: 42px;
            padding: 0 13px;
            border-radius: 12px;
            border: 1px solid rgba(62, 138, 174, 0.18);
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 0.92rem;
            font-weight: 650;
            outline: none;
            appearance: auto;
        }

        select:focus {
            border-color: var(--accent-main);
            box-shadow: 0 0 0 3px rgba(62, 138, 174, 0.13);
        }

        .button-row {
            display: grid;
            grid-template-columns: 1fr 1.8fr;
            gap: 10px;
            margin-top: 12px;
        }

        .action-btn {
            min-height: 44px;
            border-radius: 10px;
            border: 1px solid var(--btn-border);
            background: var(--btn-bg);
            color: rgba(19, 50, 65, 0.70);
            font-size: 0.95rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: var(--btn-hover-bg);
            color: var(--btn-hover-text);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(62, 138, 174, 0.20);
        }

        .meta-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 9px;
            padding-right: 4px;
            color: var(--text-sub);
            font-size: 0.72rem;
        }

        .visual-zone {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            padding: 18px 0 20px;
        }

        .chain-visual {
            width: 330px;
            max-width: 72%;
            opacity: 0.68;
            filter: drop-shadow(0 18px 22px rgba(62, 138, 174, 0.16));
            pointer-events: none;
            user-select: none;
        }

        .result-panel {
            display: none;
            margin-top: 16px;
            background: rgba(255, 255, 255, 0.24);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 14px;
            box-shadow: 0 10px 30px rgba(62, 138, 174, 0.08);
        }

        .result-panel.show { display: block; }

        .result-title {
            color: var(--accent-main);
            font-size: 0.92rem;
            font-weight: 900;
            margin: 0 0 10px;
        }

        .result-card {
            border: 1px solid rgba(80, 170, 210, 0.28);
            background: linear-gradient(180deg, #3f87ab 0%, #2d6d8d 100%);
            border-radius: 22px;
            padding: 0;
            margin-bottom: 14px;
            overflow: hidden;
            box-shadow: 0 12px 28px rgba(32, 88, 118, 0.22);
        }

        .result-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px 12px;
            background: linear-gradient(180deg, rgba(91,170,212,0.28), rgba(255,255,255,0.02));
            border-bottom: 1px solid rgba(255,255,255,0.10);
        }

        .result-model {
            font-size: 1.12rem;
            font-weight: 950;
            color: #ffffff;
            margin: 0;
        }

        .result-pitch-wrap {
            text-align: right;
        }

        .result-pitch-label {
            color: rgba(255,255,255,0.78);
            font-size: 0.72rem;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .result-pitch-value {
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 900;
        }

        .result-card:last-child { margin-bottom: 0; }

        .result-model {
            font-size: 1.02rem;
            font-weight: 950;
            color: var(--text-main);
            margin-bottom: 9px;
        }

        .spec-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0;
            font-size: 0.84rem;
            color: #ffffff;
            padding: 12px 18px 6px;
        }

        .spec-item {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 10px 0;
        }

        .spec-label {
            color: rgba(255,255,255,0.82);
            font-weight: 700;
        }

        .spec-value {
            font-weight: 900;
            color: #ffffff;
        }

        .file-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 14px 18px 18px;
        }

        .file-link {
            min-height: 38px;
            border-radius: 12px;
            border: 0;
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 900;
            box-shadow: 0 6px 16px rgba(0,0,0,0.16);
        }

        .file-link:nth-child(1) {
            background: #1e7be6;
        }

        .file-link:nth-child(2) {
            background: #d92727;
        }

        .file-link:nth-child(3) {
            background: #b8eb2f;
            color: #173000;
        }

        .empty-text, .error-text {
            text-align: center;
            color: var(--text-sub);
            font-size: 0.88rem;
            font-weight: 800;
            padding: 16px 6px;
            line-height: 1.5;
        }

        .error-text { color: #8a2c2c; }

        .bottom-area {
            margin-top: auto;
            text-align: center;
            padding: 12px 16px 0;
        }

        .bottom-inner {
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.35);
            padding: 12px 10px 16px;
        }

        .home-btn {
            padding: 9px 18px;
            border-radius: 999px;
            border: 1px solid var(--home-btn-border);
            background: var(--home-btn-bg);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            color: var(--accent-main);
            font-size: 0.92rem;
            font-weight: 500;
        }

        .home-btn:hover {
            background: var(--accent-main);
            color: #ffffff;
        }

        .bottom-brand { margin-top: 12px; }

        .bottom-brand-name {
            font-weight: 800;
            color: var(--accent-main);
            font-size: 1.15rem;
            letter-spacing: -0.02em;
        }

        .bottom-sub {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 4px;
        }


        /* ===== DWG 인증 팝업: ISO-A 검색화면과 동일한 형태 ===== */
        .auth-modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 300;
            align-items: center;
            justify-content: center;
        }

        .auth-modal-backdrop.active {
            display: flex;
        }

        .auth-modal {
            width: 320px;
            max-width: calc(100vw - 32px);
            background: rgba(232, 245, 251, 0.98);
            border: 1px solid rgba(62, 138, 174, 0.28);
            border-radius: 22px;
            padding: 28px 24px 24px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            text-align: center;
            animation: modalPop 0.22s ease;
        }

        @keyframes modalPop {
            from {
                transform: scale(0.88);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .auth-modal-icon {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #c62828;
        }

        .auth-modal-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .auth-modal-sub {
            font-size: 0.82rem;
            color: var(--text-sub);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .auth-input {
            width: 100%;
            height: 48px;
            border-radius: 13px;
            border: 1px solid rgba(62, 138, 174, 0.28);
            background: rgba(83, 83, 83, 0.9);
            color: #fff;
            font-size: 1.15rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.08em;
            outline: none;
            margin-bottom: 8px;
            padding: 0 16px;
            transition: border-color 0.2s;
        }

        .auth-input::placeholder {
            font-size: 0.85rem;
            color: rgba(180, 180, 180, 0.75);
            letter-spacing: 0;
        }

        .auth-input:focus {
            border-color: rgba(62, 138, 174, 0.65);
            box-shadow: 0 0 0 3px rgba(62, 138, 174, 0.14);
        }

        .auth-input.error {
            border-color: #e05555;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            75% {
                transform: translateX(6px);
            }
        }

        .auth-error-msg {
            font-size: 0.8rem;
            color: #d94040;
            min-height: 18px;
            margin-bottom: 14px;
            font-weight: 700;
        }

        .auth-btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .auth-cancel-btn,
        .auth-confirm-btn {
            height: 44px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.18s;
            padding: 0 10px;
        }

        .auth-cancel-btn {
            border: 1px solid #dcdfe6;
            background: #ffffff;
            color: #7f8c8d;
        }

        .auth-confirm-btn {
            border: none;
            background: linear-gradient(135deg, #c62828, #e53935);
            color: #fff;
            box-shadow: 0 6px 18px rgba(198, 40, 40, 0.30);
        }

        .auth-confirm-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 24px rgba(198, 40, 40, 0.40);
        }
        /* ===== /DWG 인증 팝업 ===== */



        .row-select-wrap {
            margin-bottom: 16px;
        }

        .row-select-label {
            display: block;
            margin: 0 0 8px;
            font-size: 0.82rem;
            font-weight: 900;
            color: var(--accent-main);
            letter-spacing: -0.02em;
        }

        .row-btn-group {
            display: flex;
            gap: 12px;
        }

        .row-btn {
            flex: 1;
            min-height: 44px;
            border-radius: 12px;
            border: 2px solid rgba(27, 67, 88, 0.85);
            background: rgba(62, 138, 174, 0.22);
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.18s ease;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
        }

        .row-btn:hover {
            transform: translateY(-1px);
            background: rgba(62, 138, 174, 0.30);
        }

        .row-btn.active {
            background: linear-gradient(180deg, #ff8b42 0%, #e85a1f 100%);
            border-color: #ffffff;
            color: #ffffff;
            box-shadow:
                0 6px 18px rgba(232, 90, 31, 0.30),
                inset 0 1px 0 rgba(255,255,255,0.35);
        }

        .row-btn.disabled {
            background: rgba(120, 140, 150, 0.22);
            border-color: rgba(90, 100, 110, 0.75);
            color: rgba(70, 80, 90, 0.55);
            cursor: not-allowed;
            opacity: 0.72;
            box-shadow: none;
        }

        .row-btn.disabled:hover {
            transform: none;
            background: rgba(120, 140, 150, 0.22);
        }


        @media (max-width: 560px) {
            .top-bar { height: 86px; }

            .title-pill {
                font-size: 1.44rem;
                max-width: calc(100% - 146px);
                padding: 7px 16px;
            }

            .content { padding: 24px 16px 0; }

            .search-panel { padding: 22px 20px 18px; }

            .chain-visual { max-width: 74%; }

            .spec-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="top-bar">
            <button class="hamburger-btn" type="button" onclick="goBack()" aria-label="이전 메뉴">☰</button>
            <div class="title-pill">할로우핀체인</div>
            <button class="menu-btn" type="button" onclick="goBack()" aria-label="체인 메뉴">
                <span class="menu-arrow">↩</span>
                <span>메뉴</span>
            </button>
        </header>

        <main class="content">
            <section class="search-panel" aria-label="할로우핀체인 검색 조건">
                <div class="field">
                    <label for="modelSelect">형번 선택 (MODEL)</label>
                    <select id="modelSelect">
                        <option value="">형번을 선택하세요</option>
                    </select>
                </div>

                <div class="row-select-wrap">
                    <label class="row-select-label">열수 선택</label>
                    <div class="row-btn-group">
                        <button type="button" class="row-btn active" id="row1Btn" onclick="selectRow('1열')">1열</button>
                        <button type="button" class="row-btn" id="row2Btn" onclick="selectRow('2열')">2열</button>
                        <button type="button" class="row-btn disabled" id="row3Btn" disabled>3열</button>
                    </div>
                </div>

                <div class="field">
                    <label for="pitchSelect">피치 선택 (P)</label>
                    <select id="pitchSelect">
                        <option value="">피치를 선택하세요</option>
                    </select>
                </div>

                <div class="field">
                    <label for="pinInnerSelect">핀내경 선택</label>
                    <select id="pinInnerSelect">
                        <option value="">핀내경을 선택하세요</option>
                    </select>
                </div>

                <div class="button-row">
                    <button class="action-btn" type="button" onclick="resetSearch()">초기화</button>
                    <button class="action-btn" type="button" onclick="searchData()">검색하기</button>
                </div>

                <div class="meta-row">
                    <span id="remainText">남은 횟수: 10 / 10</span>
                </div>
            </section>

            <section id="resultPanel" class="result-panel" aria-label="검색 결과">
                <div class="result-title">검색 결과</div>
                <div id="resultList"></div>
            </section>

            <section class="visual-zone" aria-hidden="true">
                <img src="../../../images/chain.png" alt="" class="chain-visual" onerror="this.style.display='none'">
            </section>
        </main>

        <footer class="bottom-area">
            <div class="bottom-inner">
                <button class="home-btn" onclick="goHome()">🏠 홈으로</button>
                <div class="bottom-brand" aria-label="브랜드 정보">
                    <div class="bottom-brand-name">MYCAD</div>
                    <div class="bottom-sub">Speed &amp; Simple Data Search</div>
                </div>
            </div>
        </footer>
    </div>


    <!-- DWG 도면 다운로드 전용 인증 팝업 -->
    <div class="auth-modal-backdrop" id="authModalBackdrop">
        <div class="auth-modal">
            <div id="authStep1">
                <div class="auth-modal-icon"><i class="fas fa-user"></i></div>
                <div class="auth-modal-title">정보 입력</div>
                <div class="auth-modal-sub">DWG 파일 다운로드를 위해<br>아래 정보를 입력해 주세요</div>
                <input type="text" class="auth-input" id="authNameInput" placeholder="이름을 입력하세요" maxlength="30" onkeydown="if(event.key==='Enter') document.getElementById('authEmailInput').focus()" style="margin-bottom: 10px;">
                <input type="email" class="auth-input" id="authEmailInput" placeholder="이메일을 입력하세요" maxlength="60" onkeydown="if(event.key==='Enter') submitUserInfo()">
                <div class="auth-error-msg" id="authStep1ErrorMsg"></div>
                <div class="auth-btn-row">
                    <button class="auth-cancel-btn" onclick="closeAuthModal()">취소</button>
                    <button class="auth-confirm-btn" onclick="submitUserInfo()"><i class="fas fa-arrow-right"></i> 다음</button>
                </div>
            </div>

            <div id="authStep2" style="display:none;">
                <div class="auth-modal-icon"><i class="fas fa-lock"></i></div>
                <div class="auth-modal-title">인증코드 입력</div>
                <div class="auth-modal-sub">담당자에게 받은<br>인증코드를 입력하세요</div>
                <input type="password" class="auth-input" id="authCodeInput" placeholder="인증코드 입력" maxlength="20" onkeydown="if(event.key==='Enter') confirmAuth()">
                <div class="auth-error-msg" id="authErrorMsg"></div>
                <div class="auth-btn-row">
                    <button class="auth-cancel-btn" onclick="closeAuthModal()">취소</button>
                    <button class="auth-confirm-btn" onclick="confirmAuth()"><i class="fas fa-download"></i> 다운로드</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../../../data/chain/hollow_pin_chain/hollow_pin_chain_data.js" onload="initPage()" onerror="showLoadError()"></script>

    <script>
        let hollowData = [];
        let selectedRow = '1열';
        let dataInitialized = false;

        function getHollowData() {
            if (window.hollowPinChainData && Array.isArray(window.hollowPinChainData)) {
                return window.hollowPinChainData;
            }

            if (window.rawHollowPinChainData && Array.isArray(window.rawHollowPinChainData)) {
                return window.rawHollowPinChainData;
            }

            if (window.allHollowPinChainData && Array.isArray(window.allHollowPinChainData)) {
                return window.allHollowPinChainData;
            }

            return [];
        }

        function sortValues(values) {
            return [...values].sort((a, b) => {
                const na = Number(a);
                const nb = Number(b);
                if (Number.isFinite(na) && Number.isFinite(nb)) return na - nb;
                return String(a).localeCompare(String(b), 'ko');
            });
        }

        function uniqueValues(key) {
            return sortValues(new Set(
                hollowData
                    .map(item => item[key])
                    .filter(value => value !== undefined && value !== null && value !== '')
            ));
        }

        function fillSelect(id, values, placeholder, unit) {
            const select = document.getElementById(id);
            select.innerHTML = `<option value="">${placeholder}</option>` + values.map(value => {
                const label = unit ? `${value}${unit}` : value;
                return `<option value="${value}">${label}</option>`;
            }).join('');
        }

        function initPage() {
            if (dataInitialized) return;
            dataInitialized = true;

            hollowData = getHollowData();

            if (!hollowData.length) {
                showLoadError();
                return;
            }

            fillSelect('modelSelect', uniqueValues('model'), '형번을 선택하세요', '');
            fillSelect('pitchSelect', uniqueValues('pitch'), '피치를 선택하세요', 'mm');
            fillSelect('pinInnerSelect', uniqueValues('pinInnerDiameter'), '핀내경을 선택하세요', 'mm');
        }

        function mm(value) {
            if (value === undefined || value === null || value === '') return '-';
            return `${value}mm`;
        }

        function getHollowPinFileBaseName(item) {
            /*
                형번 예: 40HP, 50HP, 60HP, 80HP
                실제 파일명 예:
                40 Hollow Pin.pdf
                40 Hollow Pin.DWG

                따라서 숫자 부분만 추출해서 "숫자 Hollow Pin" 형태로 변환합니다.
            */
            const model = String(item.model || '').trim();
            const sizeNumber = model.replace(/[^0-9]/g, '');

            if (!sizeNumber) return '';

            return `${sizeNumber} Hollow Pin`;
        }

        function makeFileHref(item, type) {
            const fileBaseName = getHollowPinFileBaseName(item);
            if (!fileBaseName) return '';

            /*
                PDF 실제 저장 위치:
                C:\CSD\download\chain\hollow_pin_chain\pdf

                DWG 실제 저장 위치:
                C:\CSD\secure-download\dwg\hollow_pin_chain

                로컬 file:// 실행 환경에서 안정적으로 연결하기 위해 절대 file:/// 경로를 사용합니다.
            */
            if (type === 'pdf') {
                return `file:///C:/CSD/download/chain/hollow_pin_chain/pdf/${encodeURIComponent(fileBaseName)}.pdf`;
            }

            if (type === 'dwg') {
                return `file:///C:/CSD/secure-download/dwg/hollow_pin_chain/${encodeURIComponent(fileBaseName)}.DWG`;
            }

            if (type === 'dxf') {
                return `file:///C:/CSD/secure-download/dxf/hollow_pin_chain/${encodeURIComponent(fileBaseName)}.dxf`;
            }

            return '';
        }

        function fileLink(item, type) {
            const href = makeFileHref(item, type);
            if (!href) return '';

            const labelMap = {
                pdf: '▣ PDF 도면',
                dwg: '🔧 DWG 도면',
                dxf: '◎ 3D 도면'
            };

            const fileBaseName = getHollowPinFileBaseName(item);
            const extMap = {
                pdf: 'pdf',
                dwg: 'DWG',
                dxf: 'dxf'
            };

            const fileName = `${fileBaseName}.${extMap[type] || type}`;

            if (type === 'dwg') {
                return `<button class="file-link" type="button" onclick="openAuthModal('${href}', '${fileName}')">${labelMap[type]}</button>`;
            }

            return `<a class="file-link" href="${href}" download="${fileName}" target="_blank" rel="noopener">${labelMap[type] || type.toUpperCase()}</a>`;
        }


        let pendingDownloadUrl = '';
        let pendingDownloadFileName = '';

        const DWG_AUTH_CODES = ['hkd8421', 'MYCAD2024'];

        function openAuthModal(url, fileName) {
            pendingDownloadUrl = url;
            pendingDownloadFileName = fileName || '';

            const modal = document.getElementById('authModalBackdrop');
            const step1 = document.getElementById('authStep1');
            const step2 = document.getElementById('authStep2');
            const nameInput = document.getElementById('authNameInput');
            const emailInput = document.getElementById('authEmailInput');
            const codeInput = document.getElementById('authCodeInput');
            const step1Error = document.getElementById('authStep1ErrorMsg');
            const codeError = document.getElementById('authErrorMsg');

            if (step1) step1.style.display = 'block';
            if (step2) step2.style.display = 'none';
            if (nameInput) nameInput.value = '';
            if (emailInput) emailInput.value = '';
            if (codeInput) codeInput.value = '';
            if (step1Error) step1Error.textContent = '';
            if (codeError) codeError.textContent = '';

            if (modal) modal.classList.add('active');

            setTimeout(() => {
                if (nameInput) nameInput.focus();
            }, 80);
        }

        function closeAuthModal() {
            const modal = document.getElementById('authModalBackdrop');
            const nameInput = document.getElementById('authNameInput');
            const emailInput = document.getElementById('authEmailInput');
            const codeInput = document.getElementById('authCodeInput');
            const step1Error = document.getElementById('authStep1ErrorMsg');
            const codeError = document.getElementById('authErrorMsg');

            if (modal) modal.classList.remove('active');
            if (nameInput) nameInput.value = '';
            if (emailInput) emailInput.value = '';
            if (codeInput) codeInput.value = '';
            if (step1Error) step1Error.textContent = '';
            if (codeError) codeError.textContent = '';

            pendingDownloadUrl = '';
            pendingDownloadFileName = '';
        }

        function submitUserInfo() {
            const nameInput = document.getElementById('authNameInput');
            const emailInput = document.getElementById('authEmailInput');
            const errorMsg = document.getElementById('authStep1ErrorMsg');

            const name = String(nameInput ? nameInput.value : '').trim();
            const email = String(emailInput ? emailInput.value : '').trim();

            if (!name) {
                if (errorMsg) errorMsg.textContent = '이름을 입력하세요.';
                if (nameInput) nameInput.focus();
                return;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                if (errorMsg) errorMsg.textContent = '올바른 이메일을 입력하세요.';
                if (emailInput) emailInput.focus();
                return;
            }

            if (errorMsg) errorMsg.textContent = '';

            document.getElementById('authStep1').style.display = 'none';
            document.getElementById('authStep2').style.display = 'block';

            setTimeout(() => {
                const codeInput = document.getElementById('authCodeInput');
                if (codeInput) codeInput.focus();
            }, 80);
        }

        function confirmAuth() {
            const codeInput = document.getElementById('authCodeInput');
            const errorMsg = document.getElementById('authErrorMsg');
            const code = String(codeInput ? codeInput.value : '').trim();

            if (!DWG_AUTH_CODES.includes(code)) {
                if (errorMsg) errorMsg.textContent = '인증코드가 올바르지 않습니다.';
                if (codeInput) {
                    codeInput.classList.add('error');
                    setTimeout(() => codeInput.classList.remove('error'), 350);
                    codeInput.focus();
                }
                return;
            }

            if (pendingDownloadUrl) {
                const link = document.createElement('a');
                link.href = pendingDownloadUrl;
                link.download = pendingDownloadFileName || '';
                link.target = '_blank';
                link.rel = 'noopener';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            closeAuthModal();
        }

        document.addEventListener('keydown', function(event) {
            const modal = document.getElementById('authModalBackdrop');

            if (event.key === 'Escape' && modal && modal.classList.contains('active')) {
                closeAuthModal();
            }
        });



        function selectRow(rowType) {
            selectedRow = rowType;

            const btn1 = document.getElementById('row1Btn');
            const btn2 = document.getElementById('row2Btn');

            btn1.classList.remove('active');
            btn2.classList.remove('active');

            if (rowType === '1열') {
                btn1.classList.add('active');
            } else {
                btn2.classList.add('active');
            }
        }

        function searchData() {
            if (!hollowData.length) {
                hollowData = getHollowData();
            }

            if (!hollowData.length) {
                showLoadError();
                return;
            }

            const model = document.getElementById('modelSelect').value;
            const pitch = document.getElementById('pitchSelect').value;
            const pinInner = document.getElementById('pinInnerSelect').value;

            const results = hollowData.filter(item => {
                const matchModel = !model || String(item.model) === model;
                const matchPitch = !pitch || Number(item.pitch) === Number(pitch);
                const matchPinInner = !pinInner || Number(item.pinInnerDiameter) === Number(pinInner);
                return matchModel && matchPitch && matchPinInner;
            });

            renderResults(results);
        }

        function renderResults(results) {
            const panel = document.getElementById('resultPanel');
            const list = document.getElementById('resultList');

            panel.classList.add('show');

            if (!results.length) {
                list.innerHTML = `<div class="empty-text">조건에 맞는 할로우핀체인이 없습니다.</div>`;
                return;
            }

            list.innerHTML = results.map(item => `
                <article class="result-card">
                    <div class="result-head">
                        <div class="result-model">${item.model}</div>
                        <div class="result-pitch-wrap">
                            <div class="result-pitch-label">피치</div>
                            <div class="result-pitch-value">${mm(item.pitch)}</div>
                        </div>
                    </div>
                    <div class="spec-grid">
                        <div class="spec-item"><span class="spec-label">피치</span><span class="spec-value">${mm(item.pitch)}</span></div>
                        <div class="spec-item"><span class="spec-label">부시경</span><span class="spec-value">${mm(item.bushDiameter)}</span></div>
                        <div class="spec-item"><span class="spec-label">링크내폭</span><span class="spec-value">${mm(item.linkInnerWidth)}</span></div>
                        <div class="spec-item"><span class="spec-label">링크두께</span><span class="spec-value">${mm(item.linkPlateThickness)}</span></div>
                        <div class="spec-item"><span class="spec-label">핀외경</span><span class="spec-value">${mm(item.pinOuterDiameter)}</span></div>
                        <div class="spec-item"><span class="spec-label">핀내경</span><span class="spec-value">${mm(item.pinInnerDiameter)}</span></div>
                        <div class="spec-item"><span class="spec-label">핀길이 A</span><span class="spec-value">${mm(item.pinLengthA)}</span></div>
                    </div>
                    <div class="file-row">
                        ${fileLink(item, 'pdf')}
                        ${fileLink(item, 'dwg')}
                        ${fileLink(item, 'dxf')}
                    </div>
                </article>
            `).join('');
        }

        function showLoadError() {
            const panel = document.getElementById('resultPanel');
            const list = document.getElementById('resultList');
            panel.classList.add('show');
            list.innerHTML = `
                <div class="error-text">
                    데이터 파일을 읽어오지 못했습니다.<br>
                    C:\\CSD\\data\\chain\\hollow_pin_chain\\hollow_pin_chain_data.js 위치와 파일명을 확인하세요.<br>
                    현재 HTML 기준 연결 경로: ../../../data/chain/hollow_pin_chain/hollow_pin_chain_data.js
                </div>
            `;
        }

        function resetSearch() {
            document.getElementById('modelSelect').value = '';
            document.getElementById('pitchSelect').value = '';
            document.getElementById('pinInnerSelect').value = '';
            selectRow('1열');
            document.getElementById('resultPanel').classList.remove('show');
            document.getElementById('resultList').innerHTML = '';
        }

        function goBack() {
            window.location.href = '../chain_main.html';
        }

        function goHome() {
            window.location.href = '../../../index.html';
        }

        document.addEventListener('DOMContentLoaded', function () {
            setTimeout(function () {
                if (!dataInitialized) {
                    initPage();
                }
            }, 80);
        });
    </script>
</body>
</html>
