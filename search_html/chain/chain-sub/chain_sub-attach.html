<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>어태치먼트 체인검색</title>

    <link rel="manifest" href="../../manifest.json">
    <meta name="theme-color" content="#3e8aae">

    <style>
        :root {
            --accent-main: rgb(62, 138, 174);
            --accent-soft: rgba(62, 138, 174, 0.15);
            --accent-border: rgba(62, 138, 174, 0.34);
            --bg-top: #e8f5fb;
            --bg-bottom: #d7ebf4;
            --text-main: #133241;
            --text-sub: rgba(19, 50, 65, 0.72);
            --home-btn-bg: rgba(62, 138, 174, 0.12);
            --home-btn-border: rgba(62, 138, 174, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            background:
                radial-gradient(circle at top, rgba(62, 138, 174, 0.25), transparent 55%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            display: flex;
            justify-content: center;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .page {
            max-width: 800px;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 34px 20px 42px;
        }

        .hero-header {
            text-align: center;
            margin-bottom: 51px;
        }

        .brand-tag {
            display: inline-block;
            padding: 6px 18px;
            border-radius: 999px;
            background: var(--accent-soft);
            border: 1px solid var(--accent-border);
            color: var(--accent-main);
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.08em;
        }

        .main-title {
            margin: 12px 0 0;
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .attachment-nav-wrap {
            width: 100%;
            max-width: 720px;
            margin: 0 auto 56px;
            padding: 0 18px;
        }

        .attachment-nav-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
        }

        .attachment-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .attachment-nav-btn {
            position: relative;
            aspect-ratio: 1 / 1;
            width: 85%;
            padding: 14px 14px 40px;
            border: 2px solid rgba(0, 0, 0, 0.50);
            border-radius: 24px;
            background:
                radial-gradient(circle at 34% 20%, rgba(255, 255, 255, 0.72), transparent 42%),
                linear-gradient(145deg, #f3fbff 0%, #d6eef8 50%, #c7e4ef 100%);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                inset 0 -18px 34px rgba(57, 121, 148, 0.12),
                0 7px 0 rgba(0, 0, 0, 0.05),
                0 14px 24px rgba(0, 0, 0, 0.18);
            transition:
                transform 0.18s ease,
                background 0.18s ease,
                box-shadow 0.18s ease,
                border-color 0.18s ease;
        }

        .attachment-nav-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.4), transparent 38%);
            pointer-events: none;
        }

        .attachment-nav-btn img {
            position: relative;
            z-index: 1;
            width: 156%;
            max-height: 124%;
            object-fit: contain;
            opacity: 0.98;
            filter: drop-shadow(0 8px 7px rgba(0, 0, 0, 0.28));
            transition:
                transform 0.18s ease,
                filter 0.18s ease;
        }

        .attachment-nav-label {
            position: absolute;
            left: 8px;
            right: 8px;
            bottom: 14px;
            z-index: 1;
            color: rgba(37, 48, 58, 0.72);
            font-size: clamp(1.2rem, 3.24vw, 1.86rem);
            font-weight: 600;
            line-height: 1;
            letter-spacing: -0.04em;
            text-align: center;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.54);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.18s ease, text-shadow 0.18s ease;
        }

        .attachment-nav-btn:hover,
        .attachment-nav-btn.active {
            background:
                radial-gradient(circle at 34% 20%, rgba(255, 255, 255, 0.48), transparent 40%),
                linear-gradient(145deg, #acd0ff 0%, #7eb5f1 48%, #5b9ee6 100%);
            transform: translateY(-3px);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.75),
                inset 0 -18px 34px rgba(20, 86, 165, 0.15),
                0 7px 0 rgba(0, 0, 0, 0.05),
                0 17px 28px rgba(0, 0, 0, 0.24);
        }

        .attachment-nav-btn:hover img,
        .attachment-nav-btn.active img {
            transform: scale(1.04);
            filter: drop-shadow(0 9px 8px rgba(0, 0, 0, 0.32));
        }

        .attachment-nav-btn:hover .attachment-nav-label,
        .attachment-nav-btn.active .attachment-nav-label {
            color: rgba(35, 43, 52, 0.86);
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
        }

        .download-buttons {
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        .download-btn {
            padding: 4px 8px;
            border: 1px solid var(--accent-border);
            background: rgba(255, 255, 255, 0.7);
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--accent-main);
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
        }



        .pdf-download {
    background: rgba(255, 235, 59, 1);
    border-color: rgba(180, 150, 0, 0.45);
    color: rgba(40, 40, 20, 0.9);
}

.dwg-download {
    background: rgba(255, 127, 80, 0.20);
    border-color: rgba(255, 127, 80, 0.45);
    color: rgba(120, 55, 35, 0.9);
}

        .download-btn:hover {
            background: var(--accent-main);
            color: white;
            transform: translateY(-1px);
        }

        .bottom-area {
            margin-top: auto;
            padding-top: 28px;
            text-align: center;
        }

        .home-btn {
            margin-top: 10px;
            padding: 10px 18px;
            border-radius: 999px;
            border: 1px solid var(--home-btn-border);
            background: var(--home-btn-bg);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            color: var(--accent-main);
            font-size: 0.92rem;
            font-weight: 700;
        }

        .home-btn:hover {
            background: var(--accent-main);
            color: #ffffff;
        }

        .bottom-brand {
            margin-top: 14px;
            cursor: pointer;
        }

        .bottom-brand-name {
            font-weight: 800;
            color: var(--accent-main);
            font-size: 1.15rem;
            letter-spacing: -0.02em;
        }

        .bottom-sub {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 4px;
        }

        @media (max-width: 560px) {
            .page {
                padding: 28px 14px 34px;
            }

            .hero-header {
                margin-bottom: 42px;
            }

            .main-title {
                font-size: 1.55rem;
            }

            .attachment-nav-wrap {
                max-width: 430px;
                padding: 0 8px;
                margin-bottom: 48px;
            }

            .attachment-nav-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 14px;
            }

            .attachment-nav-btn {
                width: 85%;
                padding: 10px 10px 34px;
                border-radius: 18px;
            }

            .attachment-nav-btn img {
                width: 160%;
                max-height: 120%;
            }

            .attachment-nav-label {
                bottom: 11px;
            }

            .download-btn {
                padding: 3px 6px;
                font-size: 0.6rem;
            }

            .bottom-area {
                padding-top: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="hero-header">
            <div class="brand-tag">ATTATCHMENT CHAIN</div>
            <div class="main-title">어태치먼트 체인검색</div>
        </div>

        <section class="attachment-nav-wrap" aria-label="어태치먼트 체인 형식 이미지 네비">
            <div id="attachmentNavGrid" class="attachment-nav-grid"></div>
        </section>

        <div class="bottom-area">
            <button class="home-btn" type="button" onclick="goHome()">🏠 홈으로</button>

            <div class="bottom-brand" aria-label="브랜드 정보" role="button" tabindex="0" onclick="goIndex()" onkeydown="handleBrandKey(event)">
                <div class="bottom-brand-name">MYCAD</div>
                <div class="bottom-sub">Speed &amp; Simple Data Search</div>
            </div>
        </div>
    </div>

    <script>
        const attachmentNavItems = [
            { name: "1LA1", image: "1LA1.png", url: "" },
            { name: "1LAA1", image: "1LAA1.png", url: "" },
            { name: "2LA1", image: "2LA1.png", url: "" },
            { name: "2LAA1", image: "2LAA1.png", url: "" },
            { name: "1LK1", image: "1LK1.png", url: "" },
            { name: "1LKK1", image: "1LKK1.png", url: "" },
            { name: "2LK1", image: "2LK1.png", url: "" },
            { name: "2LKK1", image: "2LKK1.png", url: "" },
            { name: "1LSA1", image: "1LSA1.png", url: "" },
            { name: "1LSAA1", image: "1LSAA1.png", url: "" },
            { name: "1LSK1", image: "1LSK1.png", url: "" },
            { name: "1LSKK1", image: "1LSKK1.png", url: "" },
            { name: "2LSA1", image: "2LSA1.png", url: "" },
            { name: "2LSAA1", image: "2LSAA1.png", url: "" },
            { name: "2LSK1", image: "2LSK1.png", url: "" },
            { name: "2LSKK1", image: "2LSKK1.png", url: "" },
            { name: "2LWA1", image: "2LWA1.png", url: "" },
            { name: "2LWA2", image: "2LWA2.png", url: "" },
            { name: "2LWK1", image: "2LWK1.png", url: "" },
            { name: "2LWK2", image: "2LWK2.png", url: "" },
            { name: "2LWSA1", image: "2LWSA1.png", url: "" },
            { name: "2LWSA2", image: "2LWSA2.png", url: "" }
        ];

        const ACTIVE_KEY = 'selected_attachment_chain_type';

        function renderAttachmentNav() {
            const grid = document.getElementById('attachmentNavGrid');
            localStorage.removeItem(ACTIVE_KEY);
            const savedName = null;

            grid.innerHTML = attachmentNavItems.map(item => `
                <div class="attachment-item">
                    <button class="attachment-nav-btn ${savedName === item.name ? 'active' : ''}"
                            type="button"
                            title="${item.name}"
                            aria-label="${item.name}"
                            onclick="selectAttachmentNav(this, '${item.name}', '${item.url}')">
                        <img src="../../../images/chain_navi_btn1/${item.image}" alt="${item.name}">
                        <span class="attachment-nav-label">${item.name}</span>
                    </button>
                    <div class="download-buttons">
                        <a href="../../../download/chain/pdf/${item.name}.pdf" 
                           class="download-btn pdf-download" 
                           download="${item.name}.pdf">PDF</a>
                        <a href="../../../download/chain/dwg/${item.name}.dwg" 
                           class="download-btn dwg-download" 
                           download="${item.name}.dwg">DWG</a>
                    </div>
                </div>
            `).join('');
        }

        function selectAttachmentNav(el, name, url) {
            document.querySelectorAll('.attachment-nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            el.classList.add('active');
            localStorage.setItem(ACTIVE_KEY, name);

            if (url) {
                setTimeout(() => {
                    window.location.href = url;
                }, 120);
            }
        }

        function goHome() {
            window.location.href = '../chain_main.html';
        }

        // ✅ 유일하게 수정된 부분: ../../../index.html → https://www.google.com
        function goIndex() {
            window.open('https://www.google.com', '_blank');
        }

        function handleBrandKey(event) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                goIndex();
            }
        }

        window.onload = renderAttachmentNav;
    </script>
</body>
</html>
