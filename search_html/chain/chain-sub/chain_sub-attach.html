<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>어태치먼트 체인검색</title>

    <link rel="manifest" href="../../manifest.json">
    <meta name="theme-color" content="#3e8aae">

    <style>
        :root {
            --accent-main: rgb(62, 138, 174);
            --accent-soft: rgba(62, 138, 174, 0.15);
            --accent-border: rgba(62, 138, 174, 0.34);
            --bg-top: #e8f5fb;
            --bg-bottom: #d7ebf4;
            --text-main: #133241;
            --text-sub: rgba(19, 50, 65, 0.72);
            --home-btn-bg: rgba(62, 138, 174, 0.12);
            --home-btn-border: rgba(62, 138, 174, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            background:
                radial-gradient(circle at top, rgba(62, 138, 174, 0.25), transparent 55%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            display: flex;
            justify-content: center;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .page {
            max-width: 800px;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 34px 20px 42px;
        }

        .hero-header {
            text-align: center;
            margin-bottom: 51px;
        }

        .brand-tag {
            display: inline-block;
            padding: 6px 18px;
            border-radius: 999px;
            background: var(--accent-soft);
            border: 1px solid var(--accent-border);
            color: var(--accent-main);
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.08em;
        }

        .main-title {
            margin: 12px 0 0;
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        /* 수정: 네비 버튼 선택 후 제목 색상 */
        .main-title.list-selected-title {
            color: #0077ff;
        }

        .attachment-nav-wrap {
            width: 100%;
            max-width: 720px;
            margin: 0 auto 56px;
            padding: 0 18px;
        }

        .attachment-nav-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 22px;
        }

        .attachment-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .attachment-nav-btn {
            position: relative;
            aspect-ratio: 1 / 1;
            width: 85%;
            padding: 14px 14px 40px;
            border: 2px solid rgba(0, 0, 0, 0.50);
            border-radius: 24px;
            background:
                radial-gradient(circle at 34% 20%, rgba(255, 255, 255, 0.72), transparent 42%),
                linear-gradient(145deg, #f3fbff 0%, #d6eef8 50%, #c7e4ef 100%);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.8),
                inset 0 -18px 34px rgba(57, 121, 148, 0.12),
                0 7px 0 rgba(0, 0, 0, 0.05),
                0 14px 24px rgba(0, 0, 0, 0.18);
            transition:
                transform 0.18s ease,
                background 0.18s ease,
                box-shadow 0.18s ease,
                border-color 0.18s ease;
        }

        .attachment-nav-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.4), transparent 38%);
            pointer-events: none;
        }

        .attachment-nav-btn img {
            position: relative;
            z-index: 1;
            width: 156%;
            max-height: 124%;
            object-fit: contain;
            opacity: 0.98;
            filter: drop-shadow(0 8px 7px rgba(0, 0, 0, 0.28));
            transition:
                transform 0.18s ease,
                filter 0.18s ease;
        }

        .attachment-nav-label {
            position: absolute;
            left: 8px;
            right: 8px;
            bottom: 14px;
            z-index: 1;
            color: rgba(37, 48, 58, 0.72);
            font-size: clamp(1.2rem, 3.24vw, 1.86rem);
            font-weight: 600;
            line-height: 1;
            letter-spacing: -0.04em;
            text-align: center;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.54);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.18s ease, text-shadow 0.18s ease;
        }

        .attachment-nav-btn:hover,
        .attachment-nav-btn.active {
            background:
                radial-gradient(circle at 34% 20%, rgba(255, 255, 255, 0.48), transparent 40%),
                linear-gradient(145deg, #acd0ff 0%, #7eb5f1 48%, #5b9ee6 100%);
            transform: translateY(-3px);
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.75),
                inset 0 -18px 34px rgba(20, 86, 165, 0.15),
                0 7px 0 rgba(0, 0, 0, 0.05),
                0 17px 28px rgba(0, 0, 0, 0.24);
        }

        .attachment-nav-btn:hover img,
        .attachment-nav-btn.active img {
            transform: scale(1.04);
            filter: drop-shadow(0 9px 8px rgba(0, 0, 0, 0.32));
        }

        .attachment-nav-btn:hover .attachment-nav-label,
        .attachment-nav-btn.active .attachment-nav-label {
            color: rgba(35, 43, 52, 0.86);
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
        }

        .download-buttons {
            display: flex;
            gap: 6px;
            justify-content: center;
        }

        .download-btn {
            padding: 4px 8px;
            border: 1px solid var(--accent-border);
            background: rgba(255, 255, 255, 0.7);
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--accent-main);
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
        }



        .pdf-download {
    background: rgba(255, 235, 59, 1);
    border-color: rgba(180, 150, 0, 0.45);
    color: rgba(40, 40, 20, 0.9);
}

.dwg-download {
    background: rgba(255, 127, 80, 0.20);
    border-color: rgba(255, 127, 80, 0.45);
    color: rgba(120, 55, 35, 0.9);
}

        .download-btn:hover {
            background: var(--accent-main);
            color: white;
            transform: translateY(-1px);
        }

        .bottom-area {
            margin-top: auto;
            padding-top: 28px;
            text-align: center;
        }

        .home-btn {
            margin-top: 10px;
            padding: 10px 18px;
            border-radius: 999px;
            border: 1px solid var(--home-btn-border);
            background: var(--home-btn-bg);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            color: var(--accent-main);
            font-size: 0.92rem;
            font-weight: 700;
        }

        .home-btn:hover {
            background: var(--accent-main);
            color: #ffffff;
        }

        .bottom-brand {
            margin-top: 14px;
            cursor: pointer;
        }

        .bottom-brand-name {
            font-weight: 800;
            color: var(--accent-main);
            font-size: 1.15rem;
            letter-spacing: -0.02em;
        }

        .bottom-sub {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 4px;
        }


        /* =========================================================
           수정: 네비 버튼 크기 15% 축소
           - 기존 width: 85% 기준에서 약 15% 줄인 72% 적용
           ========================================================= */
        .attachment-nav-btn {
            width: 72%;
        }

        /* =========================================================
           수정: RS 규격 리스트 화면
           - 네비 버튼 클릭 시 네비 영역을 숨기고 리스트 화면 표시
           - 우측 상단 이전 버튼으로 네비 화면 복귀
           ========================================================= */
        .list-view {
            display: none;
            width: 100%;
            max-width: 720px;
            margin: 0 auto 44px;
        }

        .list-view.active {
            display: block;
        }

        .list-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .list-title-wrap {
            min-width: 0;
        }

        .list-title {
            margin: 0;
            color: var(--text-main);
            font-size: 1.15rem;
            font-weight: 850;
            letter-spacing: -0.04em;
        }

        .list-sub {
            margin-top: 4px;
            color: var(--text-sub);
            font-size: 0.8rem;
        }

        .return-btn {
            flex: none;
            border: 1px solid rgba(62, 138, 174, 0.36);
            background: rgba(62, 138, 174, 0.14);
            color: var(--accent-main);
            border-radius: 999px;
            padding: 9px 14px;
            font-size: 0.86rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .return-btn:hover {
            background: var(--accent-main);
            color: #fff;
            transform: translateY(-1px);
        }

        .rs-list-head {
            text-align: center;
            padding: 10px 12px;
            margin-bottom: 12px;
            border-radius: 14px;
            border: 1px solid rgba(62, 138, 174, 0.22);
            background: rgba(255, 255, 255, 0.32);
            color: rgba(19, 50, 65, 0.72);
            font-weight: 800;
            font-size: 0.85rem;
        }

        .rs-result-card {
            background:
        linear-gradient(
            145deg,
            rgba(225, 242, 250, 0.95) 0%,
            rgba(198, 225, 238, 0.96) 100%
        );
            border-radius: 18px;
            margin-bottom: 12px;
            overflow: hidden;
            color: #234150;
            box-shadow: 0 10px 22px rgba(62, 138, 174, 0.10);
            border: 1px solid rgba(62, 138, 174, 0.16);
        }

        /* 수정: RS 리스트 카드 홀/짝 톤 구분 */
        .rs-result-card:nth-child(odd) {
            background:
                linear-gradient(
                    145deg,
                    rgba(229, 245, 252, 0.98) 0%,
                    rgba(202, 229, 241, 0.98) 100%
                );
        }

        /* 수정: RS 리스트 카드 홀/짝 톤 구분 */
        .rs-result-card:nth-child(even) {
            background:
                linear-gradient(
                    145deg,
                    rgba(211, 235, 246, 0.98) 0%,
                    rgba(184, 218, 234, 0.98) 100%
                );
        }


        .rs-result-top {
            display: grid;
            grid-template-columns: 64px 1fr 1fr 1fr 42px;
            align-items: center;
            gap: 10px;
            padding: 16px 18px;
        }

        .rs-model {
            color: #172335;
            font-size: 1rem;
            font-weight: 900;
        }

        .rs-spec {
            min-width: 0;
        }

        .rs-spec div {
            color: rgba(37, 48, 58, 0.58);
            font-size: 0.72rem;
            margin-bottom: 4px;
        }

        .rs-spec strong {
            color: #1c3645;
            font-size: 1rem;
            font-weight: 900;
            white-space: nowrap;
        }

        .rs-unit {
            font-size: 0.68rem;
            opacity: 0.82;
            margin-left: 2px;
        }

        .rs-toggle-btn {
            /* 수정: 우측 화살표 시인성 강화 - 흰색 둥근사각 배경 제거 */
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 0;
            background: transparent;
            color: #8cc63f;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 1000;
            line-height: 1;
            text-shadow:
                0 1px 0 rgba(255,255,255,0.55),
                0 3px 8px rgba(57, 121, 148, 0.25);
            transition: transform 0.18s ease, color 0.18s ease, text-shadow 0.18s ease;
        }

        .rs-toggle-btn:hover {
            /* 수정: hover 시에도 배경 없이 화살표만 강조 */
            background: transparent;
            color: #a6e44d;
            transform: translateY(-1px) scale(1.08);
            text-shadow:
                0 1px 0 rgba(255,255,255,0.7),
                0 5px 12px rgba(140, 198, 63, 0.28);
        }

        .rs-result-detail {
            display: none;
            background:
        linear-gradient(
            180deg,
            rgba(189, 220, 235, 0.92) 0%,
            rgba(170, 205, 222, 0.95) 100%
        );
            padding: 14px 18px 16px;
            border-top: 1px solid rgba(255,255,255,0.10);
        }

        .rs-result-card.open .rs-result-detail {
            display: block;
        }

        .rs-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 18px;
            margin-bottom: 14px;
        }

        .rs-detail-row {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding-bottom: 7px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .rs-detail-row span {
            color: rgba(35, 74, 96, 0.78);
            font-size: 0.84rem;
            font-weight: 800;
        }

        .rs-detail-row strong {
            color: #183443;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .rs-download-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 9px;
        }

        .rs-action-btn {
            border: none;
            border-radius: 12px;
            padding: 10px 6px;
            color: #fff;
            text-align: center;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 900;
            cursor: pointer;
            transition: transform 0.16s ease, box-shadow 0.16s ease;
        }

        .rs-action-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.16);
        }

        .rs-pdf-btn { background: #2879c8; }
        .rs-dwg-btn { background: #c82424; }
        .rs-3d-btn {
            background: #bdf42b;
            color: #111;
        }

        /* =========================================================
           수정: RS 규격 선택 팝업
           - 네비 화면의 PDF/DWG 버튼 클릭 시 RS25~RS140 선택
           ========================================================= */
        .rs-modal-backdrop,
        .auth-modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 300;
            background: rgba(19, 50, 65, 0.48);
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        .rs-modal-backdrop.active,
        .auth-modal-backdrop.active {
            display: flex;
        }

        .rs-modal,
        .auth-modal {
            width: 360px;
            max-width: 100%;
            background: rgba(235, 248, 253, 0.98);
            border: 1px solid rgba(62, 138, 174, 0.28);
            border-radius: 22px;
            padding: 22px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.28);
            text-align: center;
        }

        .rs-modal-title,
        .auth-modal-title {
            font-size: 1.08rem;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .rs-modal-sub,
        .auth-modal-sub {
            color: var(--text-sub);
            font-size: 0.82rem;
            line-height: 1.45;
            margin-bottom: 16px;
        }

        .rs-size-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }

        .rs-size-btn {
            border: 1px solid rgba(62, 138, 174, 0.24);
            border-radius: 12px;
            padding: 10px 6px;
            background: rgba(62, 138, 174, 0.12);
            color: var(--text-main);
            font-weight: 900;
            cursor: pointer;
        }

        .rs-size-btn:hover {
            background: var(--accent-main);
            color: #fff;
        }

        .modal-cancel-btn,
        .auth-cancel-btn,
        .auth-confirm-btn {
            width: 100%;
            height: 42px;
            border-radius: 12px;
            border: 1px solid rgba(62, 138, 174, 0.28);
            background: #fff;
            color: var(--text-main);
            font-weight: 900;
            cursor: pointer;
        }

        .auth-input {
            width: 100%;
            height: 46px;
            margin-bottom: 9px;
            padding: 0 14px;
            border-radius: 13px;
            border: 1px solid rgba(62, 138, 174, 0.30);
            background: rgba(255,255,255,0.78);
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 700;
            outline: none;
        }

        .auth-error-msg {
            min-height: 18px;
            margin-bottom: 12px;
            color: #d32f2f;
            font-size: 0.8rem;
            font-weight: 800;
        }

        .auth-btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .auth-confirm-btn {
            border: none;
            background: linear-gradient(135deg, #c62828, #e53935);
            color: #fff;
        }


        @media (max-width: 560px) {
            .page {
                padding: 28px 14px 34px;
            }

            .hero-header {
                margin-bottom: 42px;
            }

            .main-title {
                font-size: 1.55rem;
            }

            .attachment-nav-wrap {
                max-width: 430px;
                padding: 0 8px;
                margin-bottom: 48px;
            }

            .attachment-nav-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 14px;
            }

            .attachment-nav-btn {
                width: 85%;
                padding: 10px 10px 34px;
                border-radius: 18px;
            }

            .attachment-nav-btn img {
                width: 160%;
                max-height: 120%;
            }

            .attachment-nav-label {
                bottom: 11px;
            }

            .download-btn {
                padding: 3px 6px;
                font-size: 0.6rem;
            }

            .bottom-area {
                padding-top: 20px;
            }

            /* 수정: 모바일 리스트 화면 정렬 */
            .attachment-nav-btn {
                width: 72%;
            }


            /* 수정: 모바일에서도 화살표를 크게 유지 */
            .rs-toggle-btn {
                width: 36px;
                height: 36px;
                font-size: 1.75rem;
            }

            .rs-result-top {
                grid-template-columns: 58px 1fr 1fr 1fr 38px;
                gap: 7px;
                padding: 14px 12px;
            }

            .rs-spec div {
                font-size: 0.66rem;
            }

            .rs-spec strong {
                font-size: 0.9rem;
            }

            .rs-detail-grid {
                gap: 10px 12px;
            }

            .rs-download-buttons {
                gap: 7px;
            }

            .rs-action-btn {
                font-size: 0.74rem;
                padding: 9px 4px;
            }

        }
    </style>
</head>
<body>
    <div class="page">
        <div class="hero-header">
            <div class="brand-tag">ATTATCHMENT CHAIN</div>
            <div id="mainTitle" class="main-title">어태치먼트 체인검색</div>
        </div>

        <section id="attachmentNavWrap" class="attachment-nav-wrap" aria-label="어태치먼트 체인 형식 이미지 네비">
            <div id="attachmentNavGrid" class="attachment-nav-grid"></div>
        </section>

        <!-- 수정: 네비 버튼 클릭 후 표시되는 RS25~RS140 리스트 화면 -->
        <section id="attachmentListView" class="list-view" aria-label="어태치먼트 체인 규격 리스트">
            <div class="list-top-bar">
                <div class="list-title-wrap">
                    <h2 id="listTitle" class="list-title">-</h2>
                    <div class="list-sub">RS 규격별 기본 치수와 도면 다운로드</div>
                </div>
                <button type="button" class="return-btn" onclick="returnToNav()">← 이전</button>
            </div>
            <div id="rsListHead" class="rs-list-head">1 / 1 페이지</div>
            <div id="rsListArea"></div>
        </section>

        <!-- 수정: 네비 화면 PDF/DWG 버튼용 RS 규격 선택 팝업 -->
        <div id="rsSelectModalBackdrop" class="rs-modal-backdrop">
            <div class="rs-modal">
                <div class="rs-modal-title">RS 규격 선택</div>
                <div id="rsSelectModalSub" class="rs-modal-sub">다운로드할 규격을 선택하세요.</div>
                <div id="rsSizeGrid" class="rs-size-grid"></div>
                <button type="button" class="modal-cancel-btn" onclick="closeRsSelectModal()">취소</button>
            </div>
        </div>

        <!-- 수정: DWG 다운로드 인증 팝업 -->
        <div id="authModalBackdrop" class="auth-modal-backdrop">
            <div class="auth-modal">
                <div id="authStep1">
                    <div class="auth-modal-title">정보 입력</div>
                    <div class="auth-modal-sub">DWG 파일 다운로드를 위해<br>이름과 이메일을 입력해 주세요.</div>
                    <input type="text" class="auth-input" id="authNameInput" placeholder="이름" maxlength="30">
                    <input type="email" class="auth-input" id="authEmailInput" placeholder="이메일" maxlength="60">
                    <div class="auth-error-msg" id="authStep1ErrorMsg"></div>
                    <div class="auth-btn-row">
                        <button type="button" class="auth-cancel-btn" onclick="closeAuthModal()">취소</button>
                        <button type="button" class="auth-confirm-btn" onclick="submitUserInfo()">다음</button>
                    </div>
                </div>

                <div id="authStep2" style="display:none;">
                    <div class="auth-modal-title">인증코드 입력</div>
                    <div class="auth-modal-sub">담당자에게 받은 인증코드를 입력하세요.</div>
                    <input type="password" class="auth-input" id="authCodeInput" placeholder="인증코드" maxlength="20">
                    <div class="auth-error-msg" id="authErrorMsg"></div>
                    <div class="auth-btn-row">
                        <button type="button" class="auth-cancel-btn" onclick="closeAuthModal()">취소</button>
                        <button type="button" class="auth-confirm-btn" onclick="confirmAuth()">다운로드</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-area">
            <button class="home-btn" type="button" onclick="goHome()">🏠 홈으로</button>

            <div class="bottom-brand" aria-label="브랜드 정보" role="button" tabindex="0" onclick="goIndex()" onkeydown="handleBrandKey(event)">
                <div class="bottom-brand-name">MYCAD</div>
                <div class="bottom-sub">Speed &amp; Simple Data Search</div>
            </div>
        </div>
    </div>

    <script>
        /* 수정: 네비 버튼 데이터
           - name: 실제 이미지/PDF/DWG 파일명에 사용
           - label: 화면 표시명. 없으면 name 표시 */
        const attachmentNavItems = [
            { name: "1LA1", label: "1LA1", image: "1LA1.png", url: "" },
            { name: "1LAA1", label: "1LAA1", image: "1LAA1.png", url: "" },
            { name: "2LA1", label: "2LA1", image: "2LA1.png", url: "" },
            { name: "2LAA1", label: "2LAA1", image: "2LAA1.png", url: "" },
            { name: "1LK1", label: "1LK1", image: "1LK1.png", url: "" },
            { name: "1LKK1", label: "1LKK1", image: "1LKK1.png", url: "" },
            { name: "2LK1", label: "2LK1", image: "2LK1.png", url: "" },
            { name: "2LKK1", label: "2LKK1", image: "2LKK1.png", url: "" },
            { name: "1LSA1", label: "1LSA1", image: "1LSA1.png", url: "" },
            { name: "1LSAA1", label: "1LSAA1", image: "1LSAA1.png", url: "" },
            { name: "1LSK1", label: "1LSK1", image: "1LSK1.png", url: "" },
            { name: "1LSKK1", label: "1LSKK1", image: "1LSKK1.png", url: "" },
            { name: "2LSA1", label: "2LSA1", image: "2LSA1.png", url: "" },
            { name: "2LSAA1", label: "2LSAA1", image: "2LSAA1.png", url: "" },
            { name: "2LSK1", label: "2LSK1", image: "2LSK1.png", url: "" },
            { name: "2LSKK1", label: "2LSKK1", image: "2LSKK1.png", url: "" },
            { name: "2LWA1", label: "2LWA1", image: "2LWA1.png", url: "" },
            { name: "2LWA2", label: "2LWA2", image: "2LWA2.png", url: "" },
            { name: "2LWK1", label: "2LWK1", image: "2LWK1.png", url: "" },
            { name: "2LWK2", label: "2LWK2", image: "2LWK2.png", url: "" },
            { name: "2LWSA1", label: "2LWSA1", image: "2LWSA1.png", url: "" },
            { name: "2LWSA2", label: "2LWSA2", image: "2LWSA2.png", url: "" }
        ];

        /* 수정: RS 규격 목록 */
        const RS_SIZE_DATA = [
            { rs: "RS25", pitch: "6.35", roller: "3.30", inner: "3.18", pin: "2.31", plate: "0.80", width: "7.9" },
            { rs: "RS35", pitch: "9.525", roller: "5.08", inner: "4.77", pin: "3.59", plate: "1.25", width: "12.0" },
            { rs: "RS40", pitch: "12.70", roller: "7.92", inner: "7.95", pin: "3.96", plate: "1.50", width: "17.0" },
            { rs: "RS50", pitch: "15.875", roller: "10.16", inner: "9.53", pin: "5.08", plate: "2.00", width: "21.0" },
            { rs: "RS60", pitch: "19.05", roller: "11.91", inner: "12.70", pin: "5.94", plate: "2.40", width: "26.0" },
            { rs: "RS80", pitch: "25.40", roller: "15.88", inner: "15.88", pin: "7.92", plate: "3.20", width: "33.0" },
            { rs: "RS100", pitch: "31.75", roller: "19.05", inner: "19.05", pin: "9.53", plate: "4.00", width: "41.0" },
            { rs: "RS120", pitch: "38.10", roller: "22.23", inner: "25.40", pin: "11.10", plate: "4.80", width: "50.0" },
            { rs: "RS140", pitch: "44.45", roller: "25.40", inner: "25.40", pin: "12.70", plate: "5.60", width: "54.0" }
        ];

        const ACTIVE_KEY = 'selected_attachment_chain_type';

        /* 수정: 다운로드 기준 경로 */
        const PDF_BASE_PATH = '../../../download/chain/conveyor_chain/atachment_chain/pdf/A1/';
        const DWG_BASE_PATH = '../../../secure-download/dwg/atatchment_chain/A1/';
        const DWG_AUTH_CODE = 'hkd8421';

        /* 수정: DWG 인증용 임시 저장값 */
        let pendingDwgUrl = '';
        let pendingDwgFileName = '';
        let pendingRsSelectType = '';
        let pendingRsSelectItemName = '';

        function renderAttachmentNav() {
            const grid = document.getElementById('attachmentNavGrid');
            localStorage.removeItem(ACTIVE_KEY);
            const savedName = null;

            grid.innerHTML = attachmentNavItems.map(item => `
                <div class="attachment-item">
                    <button class="attachment-nav-btn ${savedName === item.name ? 'active' : ''}"
                            type="button"
                            title="${item.label || item.name}"
                            aria-label="${item.label || item.name}"
                            onclick="showAttachmentList('${item.name}')">
                        <img src="../../../images/chain_navi_btn1/${item.image}" alt="${item.label || item.name}">
                        <span class="attachment-nav-label">${item.label || item.name}</span>
                    </button>

                    <!-- 수정: 네비 버튼 아래 PDF/DWG 버튼 복원
                         PDF는 RS 선택 후 바로 다운로드, DWG는 RS 선택 후 인증 절차 진행 -->
                    <div class="download-buttons">
                        <a href="javascript:void(0)"
                           class="download-btn pdf-download"
                           onclick="event.stopPropagation(); openRsSelectModal('pdf', '${item.name}')">PDF</a>
                        <a href="javascript:void(0)"
                           class="download-btn dwg-download"
                           onclick="event.stopPropagation(); openRsSelectModal('dwg', '${item.name}')">DWG</a>
                    </div>
                </div>
            `).join('');
        }

        /* 수정: 네비 버튼 클릭 시 리스트 화면 표시 */
        function showAttachmentList(itemName) {
            const navWrap = document.getElementById('attachmentNavWrap');
            const listView = document.getElementById('attachmentListView');
            const listTitle = document.getElementById('listTitle');
            const listHead = document.getElementById('rsListHead');
            const listArea = document.getElementById('rsListArea');
            const mainTitle = document.getElementById('mainTitle');

            const item = attachmentNavItems.find(v => v.name === itemName);
            const displayName = item ? (item.label || item.name) : itemName;

            /* 수정: 리스트 화면에서는 상단 제목을 '네비버튼명 + 어태치먼트체인검색'으로 표시 */
            if (mainTitle) {
                mainTitle.textContent = `${displayName} 어태치먼트체인검색`;
                mainTitle.classList.add('list-selected-title');
            }

            listTitle.textContent = `${displayName} 규격 리스트`;
            listHead.textContent = `1 / 1 페이지 · ${RS_SIZE_DATA.length}개 규격`;

            navWrap.style.display = 'none';
            listView.classList.add('active');

            listArea.innerHTML = RS_SIZE_DATA.map((rsItem, index) => {
                const sizeNumber = rsItem.rs.replace('RS', '');
                return `
                    <div class="rs-result-card">
                        <div class="rs-result-top">
                            <div class="rs-model">${rsItem.rs}</div>

                            <div class="rs-spec">
                                <div>피치</div>
                                <strong>${rsItem.pitch}<span class="rs-unit">mm</span></strong>
                            </div>

                            <div class="rs-spec">
                                <div>롤러경</div>
                                <strong>${rsItem.roller}<span class="rs-unit">mm</span></strong>
                            </div>

                            <div class="rs-spec">
                                <div>내폭</div>
                                <strong>${rsItem.inner}<span class="rs-unit">mm</span></strong>
                            </div>

                            <button type="button" class="rs-toggle-btn" onclick="toggleRsCard(this)" aria-label="상세보기">▼</button>
                        </div>

                        <div class="rs-result-detail">
                            <div class="rs-detail-grid">
                                <div class="rs-detail-row">
                                    <span>피치원</span>
                                    <strong>${rsItem.pitch} mm</strong>
                                </div>
                                <div class="rs-detail-row">
                                    <span>핀경</span>
                                    <strong>${rsItem.pin} mm</strong>
                                </div>
                                <div class="rs-detail-row">
                                    <span>롤러경</span>
                                    <strong>${rsItem.roller} mm</strong>
                                </div>
                                <div class="rs-detail-row">
                                    <span>내폭</span>
                                    <strong>${rsItem.inner} mm</strong>
                                </div>
                                <div class="rs-detail-row">
                                    <span>플레이트 두께</span>
                                    <strong>${rsItem.plate} mm</strong>
                                </div>
                                <div class="rs-detail-row">
                                    <span>전체 폭</span>
                                    <strong>${rsItem.width} mm</strong>
                                </div>
                            </div>

                            <!-- 수정: 리스트 상세 카드 하단 다운로드 버튼 -->
                            <div class="rs-download-buttons">
                                <a href="javascript:void(0)"
                                   class="rs-action-btn rs-pdf-btn"
                                   onclick="downloadAttachmentFile('pdf', '${itemName}', '${sizeNumber}')">▣ PDF 도면</a>
                                <a href="javascript:void(0)"
                                   class="rs-action-btn rs-dwg-btn"
                                   onclick="requestDwgAuth('${itemName}', '${sizeNumber}')">🔧 2D 도면</a>
                                <a href="javascript:void(0)"
                                   class="rs-action-btn rs-3d-btn"
                                   onclick="alert('3D 도면파일은 아직 준비되어 있지 않습니다.')">⊙ 3D 도면</a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        /* 수정: 리스트 화면에서 네비 화면으로 복귀 */
        function returnToNav() {
            document.getElementById('attachmentListView').classList.remove('active');
            document.getElementById('attachmentNavWrap').style.display = 'block';

            /* 수정: 이전 버튼 클릭 시 기본 제목으로 복귀 */
            const mainTitle = document.getElementById('mainTitle');
            if (mainTitle) {
                mainTitle.textContent = '어태치먼트 체인검색';
                mainTitle.classList.remove('list-selected-title');
            }
        }

        function toggleRsCard(btn) {
            const card = btn.closest('.rs-result-card');
            if (!card) return;

            card.classList.toggle('open');
            btn.textContent = card.classList.contains('open') ? '▲' : '▼';
        }

        /* 수정: PDF/DWG 파일명 생성
           예: RS25-1LA1.pdf / RS25-1LA1.dwg */
        function buildAttachmentFileName(sizeNumber, itemName, ext) {
            return `RS${sizeNumber}-${itemName}.${ext}`;
        }

        function downloadAttachmentFile(type, itemName, sizeNumber) {
            const ext = type === 'pdf' ? 'pdf' : 'dwg';
            const fileName = buildAttachmentFileName(sizeNumber, itemName, ext);
            const basePath = type === 'pdf' ? PDF_BASE_PATH : DWG_BASE_PATH;
            const url = basePath + fileName;

            const link = document.createElement('a');
            link.href = url;
            link.download = fileName;
            link.target = '_self';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        /* 수정: 네비 화면 PDF/DWG 버튼 클릭 시 RS 규격 선택 */
        function openRsSelectModal(type, itemName) {
            pendingRsSelectType = type;
            pendingRsSelectItemName = itemName;

            document.getElementById('rsSelectModalSub').textContent =
                `${itemName} ${type.toUpperCase()} 도면을 다운로드할 RS 규격을 선택하세요.`;

            const grid = document.getElementById('rsSizeGrid');
            grid.innerHTML = RS_SIZE_DATA.map(item => {
                const sizeNumber = item.rs.replace('RS', '');
                return `<button type="button" class="rs-size-btn" onclick="selectRsSize('${sizeNumber}')">${item.rs}</button>`;
            }).join('');

            document.getElementById('rsSelectModalBackdrop').classList.add('active');
        }

        function closeRsSelectModal() {
            document.getElementById('rsSelectModalBackdrop').classList.remove('active');
            pendingRsSelectType = '';
            pendingRsSelectItemName = '';
        }

        function selectRsSize(sizeNumber) {
            const type = pendingRsSelectType;
            const itemName = pendingRsSelectItemName;
            closeRsSelectModal();

            if (type === 'pdf') {
                downloadAttachmentFile('pdf', itemName, sizeNumber);
            } else {
                requestDwgAuth(itemName, sizeNumber);
            }
        }

        /* 수정: DWG 인증 절차 시작 */
        function requestDwgAuth(itemName, sizeNumber) {
            pendingDwgFileName = buildAttachmentFileName(sizeNumber, itemName, 'dwg');
            pendingDwgUrl = DWG_BASE_PATH + pendingDwgFileName;

            document.getElementById('authNameInput').value = '';
            document.getElementById('authEmailInput').value = '';
            document.getElementById('authCodeInput').value = '';
            document.getElementById('authStep1ErrorMsg').textContent = '';
            document.getElementById('authErrorMsg').textContent = '';
            document.getElementById('authStep1').style.display = 'block';
            document.getElementById('authStep2').style.display = 'none';
            document.getElementById('authModalBackdrop').classList.add('active');
            setTimeout(() => document.getElementById('authNameInput').focus(), 120);
        }

        function closeAuthModal() {
            document.getElementById('authModalBackdrop').classList.remove('active');
            pendingDwgUrl = '';
            pendingDwgFileName = '';
        }

        function submitUserInfo() {
            const nameInput = document.getElementById('authNameInput');
            const emailInput = document.getElementById('authEmailInput');
            const errMsg = document.getElementById('authStep1ErrorMsg');

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();

            if (!name) {
                errMsg.textContent = '이름을 입력해 주세요.';
                nameInput.focus();
                return;
            }

            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                errMsg.textContent = '올바른 이메일 주소를 입력해 주세요.';
                emailInput.focus();
                return;
            }

            errMsg.textContent = '';
            document.getElementById('authStep1').style.display = 'none';
            document.getElementById('authStep2').style.display = 'block';
            setTimeout(() => document.getElementById('authCodeInput').focus(), 120);
        }

        function confirmAuth() {
            const codeInput = document.getElementById('authCodeInput');
            const errMsg = document.getElementById('authErrorMsg');

            if (codeInput.value.trim() !== DWG_AUTH_CODE) {
                errMsg.textContent = '인증코드가 올바르지 않습니다.';
                codeInput.value = '';
                codeInput.focus();
                return;
            }

            const link = document.createElement('a');
            link.href = pendingDwgUrl;
            link.download = pendingDwgFileName;
            link.target = '_self';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            closeAuthModal();
        }

        function goHome() {
            window.location.href = '../chain_main.html';
        }

        function goIndex() {
            window.open('https://www.google.com', '_blank');
        }

        function handleBrandKey(event) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                goIndex();
            }
        }

        window.onload = function() {
            renderAttachmentNav();

            document.getElementById('rsSelectModalBackdrop').addEventListener('click', function(e) {
                if (e.target === this) closeRsSelectModal();
            });

            document.getElementById('authModalBackdrop').addEventListener('click', function(e) {
                if (e.target === this) closeAuthModal();
            });
        };
    </script>
</body>
</html>
