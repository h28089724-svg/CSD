        /* ===== 수정: 중앙 여백 체인 페이드 배경 =====
           수정: 이미지 3개는 HTML 안에 Base64로 내장되어 있으므로 외부 이미지 경로가 필요 없습니다.
           수정: 검색 결과가 나와도 중앙 체인 배경은 사라지지 않고 계속 표시됩니다.
           수정: 검색 결과가 표시되면 .search-active 클래스를 붙여 추천 크기로 축소 표시합니다. */
        .middle-visual-zone {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 0 34px;
            min-height: 250px;
            overflow: hidden;
            pointer-events: none; /* 수정: 배경 이미지가 검색 결과 카드 클릭을 방해하지 않도록 처리 */
            transition: opacity 0.35s ease, min-height 0.35s ease, padding 0.35s ease; /* 수정 */
        }

        /* 수정: 예전에는 검색 후 .is-hidden으로 display:none 처리했지만,
           이제는 호환용으로만 남기고 숨기지 않습니다. */
        .middle-visual-zone.is-hidden {
            display: flex;
        }

        /* 수정: 검색 결과 표시 후 중앙 배경 영역을 더 은은하게 만듭니다. */
        .middle-visual-zone.search-active {
            opacity: 0.82;
            min-height: 135px;
            padding: 8px 0 18px;
        }

        .middle-visual-zone::before {
            content: '';
            position: absolute;
            width: min(430px, 84vw);
            height: min(265px, 48vw);
            border-radius: 999px;
            background: radial-gradient(circle, rgba(62, 138, 174, 0.16), transparent 68%);
            filter: blur(2px);
            opacity: 0.72;
            pointer-events: none;
            transition: width 0.45s ease, height 0.45s ease, opacity 0.35s ease; /* 수정 */
        }

        /* 수정: 검색 결과 표시 후 배경 빛 번짐도 함께 50% 수준으로 축소 */
        .middle-visual-zone.search-active::before {
            width: min(215px, 42vw);
            height: min(132px, 24vw);
            opacity: 0.42;
        }

        .fade-chain-wrap {
            position: relative;
            z-index: 1;
            width: min(410px, 76vw); /* 수정: 검색 전 기본 크기 */
            aspect-ratio: 490 / 340;
            pointer-events: none;
            user-select: none;
            transform: translateY(-6px);
            transition: width 0.45s ease, transform 0.45s ease; /* 수정: 검색 전/후 크기 변화 자연스럽게 */
        }

        /* 수정: 검색 결과 표시 후 이미지 크기를 추천값으로 조정 */
        /* 수정: 기존 50% 축소값보다 조금 크게 보여 배경 이미지가 더 잘 보이도록 변경 */
        .middle-visual-zone.search-active .fade-chain-wrap {
            width: min(260px, 48vw);
            transform: translateY(-2px);
        }

        .fade-chain-image {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            animation: chainSoftFade 12s infinite ease-in-out;
            filter: grayscale(0.08) saturate(0.92) contrast(1.02) drop-shadow(0 18px 26px rgba(62, 138, 174, 0.20));
        }

        .fade-chain-image:nth-child(1) { animation-delay: 0s; }
        .fade-chain-image:nth-child(2) { animation-delay: 4s; }
        .fade-chain-image:nth-child(3) { animation-delay: 8s; }

        @keyframes chainSoftFade {
            0%   { opacity: 0; transform: scale(0.985); }
            10%  { opacity: 0.78; transform: scale(1); }

        /* [수정-피치검색오차문구겹침표시-CSS]
           - 커서 위치: 입력칸 맨 앞쪽 유지(text-align:left)
           - 안내 문구 위치: 입력칸 안 오른쪽 화살표 앞
           - 글자 크기: 기본 입력글자 대비 20% 축소(0.8em)
           - 투명도: 80%(opacity:0.8)
           - 사용자가 값을 입력하면 안내 문구는 자동으로 숨김 */
        .pitch-input-wrap {
            position: relative;
            width: 100%;
        }

        #searchPitch {
            text-align: left;
            padding-right: 142px;
        }

        .pitch-inline-note {
            position: absolute;
            right: 34px;
            top: 50%;
            transform: translateY(-50%);
            color: #d93025;
            font-size: 0.8em;
            font-weight: 900;
            opacity: 0.8;
            pointer-events: none;
            white-space: nowrap;
            line-height: 1;
        }

        .pitch-input-wrap.has-value .pitch-inline-note {
            display: none;
        }

        /* [수정-피치입력기본굵은커서]
           피치값 입력칸에 기본 포커스를 주고, 입력 전에는 왼쪽 시작 위치에
           굵은 커서 모양이 깜박이도록 표시합니다.
           실제 입력 커서는 브라우저 기본 커서를 사용하고,
           아래 가상 커서는 사용자가 값을 입력하면 자동으로 숨겨집니다. */
        .pitch-input-wrap::before {
            content: "";
            position: absolute;
            left: 13px;
            top: 50%;
            width: 3px;
            height: 1.35em;
            transform: translateY(-50%);
            background: #133241;
            border-radius: 2px;
            opacity: 0;
            pointer-events: none;
            z-index: 2;
            animation: pitchFakeCaretBlink 0.9s steps(1, end) infinite;
        }

        .pitch-input-wrap.is-focused.is-empty::before {
            opacity: 1;
        }

        @keyframes pitchFakeCaretBlink {
            0%, 48% { opacity: 1; }
            49%, 100% { opacity: 0; }
        }

        #searchPitch {
            caret-color: #133241;
        }

        /* [수정-피치입력삭제편의]

    <script>

        function tryChainImageFallback(img) {
            const fallbacks = (img.dataset.fallbacks || '').split('|').filter(Boolean);
            const index = Number(img.dataset.fallbackIndex || 0);

            if (index < fallbacks.length) {
                img.dataset.fallbackIndex = index + 1;
                img.src = fallbacks[index];
                return;
            }

            img.style.display = 'none';
            console.warn('체인 배경 이미지를 찾을 수 없습니다:', img.getAttribute('src'));
        }

        function toggleMenu() {
            document.getElementById('sideMenu').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function goToSprocketMode() {
            window.location.href = '../sprocket/sprocket.html';

        const MAX_DAILY_SEARCH = 10;
        const SEARCH_COUNT_KEY = 'chain_iso_b_search_count';
        const SEARCH_DATE_KEY = 'chain_iso_b_search_date';

        function getTodayString() {
            return new Date().toLocaleDateString('ko-KR');
        }

        function getSearchCount() {
            const today = getTodayString();
            const savedDate = localStorage.getItem(SEARCH_DATE_KEY);

            if (savedDate !== today) {
                localStorage.setItem(SEARCH_DATE_KEY, today);
                localStorage.setItem(SEARCH_COUNT_KEY, '0');
                return 0;
            }

            return parseInt(localStorage.getItem(SEARCH_COUNT_KEY) || '0', 10);
        }

        function setSearchCount(count) {
            localStorage.setItem(SEARCH_DATE_KEY, getTodayString());
            localStorage.setItem(SEARCH_COUNT_KEY, String(count));
        }

        function checkSearchLimit() {
            const count = getSearchCount();
            const remaining = Math.max(0, MAX_DAILY_SEARCH - count);
            document.getElementById('usageCounter').textContent = `남은 횟수: ${remaining} / ${MAX_DAILY_SEARCH}`;
            return count < MAX_DAILY_SEARCH;
        }

        window.onload = function() {
            console.log('allRollerChainData:', typeof allRollerChainData !== 'undefined' ? allRollerChainData : 'undefined');
            console.log('ISO-B active data:', getIsoBRollerChainData());
            populateModelSelect();
            checkSearchLimit();

            // 수정: 인증 팝업 바깥 영역 클릭 시 닫기
            const authBackdrop = document.getElementById('authModalBackdrop');
            if (authBackdrop) {
                authBackdrop.addEventListener('click', function(e) {
                    if (e.target === this) closeAuthModal();
                });
            }
        };


        /* [수정-형번열수분리입력-JS]
           데이터의 model 값이 06B-1처럼 되어 있을 때
           '-' 앞은 형번, '-' 뒤 숫자는 열수로 분리합니다. */
        function getBaseModel(modelValue) {
            return String(modelValue || '').split('-')[0].trim();
        }

        function getStrandCount(modelValue) {
            const match = String(modelValue || '').match(/-(\d+)\s*$/);
            return match ? match[1] : '1';
        }

        function buildModelWithStrand(baseModel, strandCount) {
            if (!baseModel) return '';
            if (!strandCount) return baseModel;
            return `${baseModel}-${strandCount}`;
        }

        function normalizeNumber(value) {
            if (value === null || value === undefined || value === '') return '';
            return String(value).replace(/\.0$/, '');
        }

        function isIsoBModel(modelValue) {
            return /^[0-9]+B(?:-\d+)?(?:-\d+)?$/i.test(String(modelValue || '').trim());
        }

        /* [수정-ISO-B데이터정리]
           수정된 ISO-B 데이터 파일에는 1열/2열 데이터가 모두 들어 있으므로,
           더 이상 1열 데이터를 복사해 2열 데이터를 자동 생성하지 않습니다.
           같은 model/pitch/ansiNo/isoNo가 중복으로 들어온 경우만 화면 표시 전에 1회 정리합니다. */
        function prepareIsoBDisplayData(sourceData) {
            const data = Array.isArray(sourceData) ? sourceData.filter(Boolean) : [];
            const seen = new Set();
            const cleaned = [];

            data.forEach(item => {
                const normalizedModel = String(item.model || '').trim();
                if (!isIsoBModel(normalizedModel)) return;

                const normalizedItem = {
                    ...item,
                    model: normalizedModel
                };

                const key = [
                    normalizedItem.model.toLowerCase(),
                    normalizeNumber(normalizedItem.pitch),
                    String(normalizedItem.ansiNo || '').trim().toLowerCase(),
                    String(normalizedItem.isoNo || '').trim().toLowerCase()
                ].join('|');

                if (seen.has(key)) return;
                seen.add(key);
                cleaned.push(normalizedItem);
            });

            return cleaned.sort((a, b) => {
                const baseA = parseFloat(String(getBaseModel(a.model)).replace(/[^\d.]/g, '')) || 0;
                const baseB = parseFloat(String(getBaseModel(b.model)).replace(/[^\d.]/g, '')) || 0;
                if (baseA !== baseB) return baseA - baseB;

                const strandA = parseInt(getStrandCount(a.model), 10) || 0;
                const strandB = parseInt(getStrandCount(b.model), 10) || 0;
                if (strandA !== strandB) return strandA - strandB;

                const pitchA = Number(a.pitch) || 0;
                const pitchB = Number(b.pitch) || 0;
                return pitchA - pitchB;
            });
        }

        function getIsoBRollerChainData() {
            const loadedData = (typeof allRollerChainData !== 'undefined' && Array.isArray(allRollerChainData))
                ? allRollerChainData.filter(item => item && isIsoBModel(item.model))
                : [];

            if (loadedData.length > 0) return prepareIsoBDisplayData(loadedData);

            if (typeof ISO_B_ROLLER_CHAIN_FALLBACK_DATA !== 'undefined' && Array.isArray(ISO_B_ROLLER_CHAIN_FALLBACK_DATA)) {
                const fallbackData = ISO_B_ROLLER_CHAIN_FALLBACK_DATA.filter(item => item && isIsoBModel(item.model));
                return prepareIsoBDisplayData(fallbackData);
            }

            return [];
        }

        function populateModelSelect() {
            const select = document.getElementById('searchModel');

            const sourceData = getIsoBRollerChainData();

            if (!sourceData.length) {
                console.log('ISO-B 체인 데이터 없음');
                select.innerHTML = '<option value="">ISO-B 데이터 없음</option>';
                return;
            }

            /* [수정-ISO-B형번열수분리입력]
               형번 목록에는 06B-1, 06B-2처럼 열수까지 붙은 값을 모두 넣지 않고,
               '-' 앞의 기본 형번 06B만 중복 없이 표시합니다.
               혹시 ISO-A 데이터가 캐시에 남아 있어도 ISO-B 형번만 필터링합니다. */
            const models = [...new Set(sourceData.map(item => getBaseModel(item.model)))]
                .filter(Boolean)
                .sort((a, b) => {
                    const numA = parseFloat(String(a).replace(/[^\d.]/g, ''));
                    const numB = parseFloat(String(b).replace(/[^\d.]/g, ''));
                    return numA - numB;
                });

            select.innerHTML = '<option value="">형번을 선택하세요</option>';

            models.forEach(model => {
                const option = document.createElement('option');
                option.value = model;
                option.textContent = model;
                select.appendChild(option);
            });
        }

        function includesLoose(source, query) {
            if (!query) return true;
            return String(source ?? '').includes(String(query));
        }

        // 수정: 데이터값이 문자열이어도 숫자로 변환해 피치 범위검색에 사용
        function parseNumericValue(value) {
            if (value === null || value === undefined || value === '') return NaN;
            const cleaned = String(value).replace(/[^0-9.\-]/g, '');
            return parseFloat(cleaned);
        }

        // 수정: 입력 피치 기준 ±오차범위(1~10%) 안에 들어오는지 확인
        function isPitchWithinTolerance(dataPitch, searchPitch, toleranceValue) {
            /* [수정-피치오차절대값검색]
               기존에는 ±5를 5%로 계산해서 35 입력 시 33.25~36.75만 검색되었습니다.
               요청 기준은 절대값 ±5이므로, 이제 35 입력 시 30~40 범위로 검색합니다.
               따라서 피치 38.1인 RS120-1도 검색 결과에 포함됩니다. */
            const dataValue = parseFloat(dataPitch);
            const searchValue = parseFloat(searchPitch);
            const tolerance = 5;

            if (isNaN(dataValue) || isNaN(searchValue)) return false;

            const minValue = searchValue - tolerance;
            const maxValue = searchValue + tolerance;

            return dataValue >= minValue && dataValue <= maxValue;
        }

        function performSearch() {
            if (!checkSearchLimit()) {
                alert("체인 검색의 일일 횟수를 초과했습니다.");
                return;
            }

            const model = document.getElementById('searchModel').value;
            const strand = document.getElementById('searchStrand') ? document.getElementById('searchStrand').value : '';
            const pitch = document.getElementById('searchPitch').value;
            const pitchTolerance = 5; // [수정-피치오차절대값검색] ±5 절대값 고정
            let results = getIsoBRollerChainData();

            /* [수정-형번열수분리입력]
               model은 06B 같은 기본 형번으로 비교하고,
               strand는 '-' 뒤 열수 1열/2열만 별도로 비교합니다. */
            if (model) results = results.filter(d => getBaseModel(d.model) === model);
            if (strand) results = results.filter(d => getStrandCount(d.model) === strand);

            // 수정: 피치 검색은 입력값 기준 절대값 ±5 범위 검색
            if (pitch) {
                results = results.filter(d => isPitchWithinTolerance(d.pitch, pitch, pitchTolerance));
            }

            displayResults(results, pitch, pitchTolerance, model, strand);

            const currentCount = getSearchCount();
            setSearchCount(currentCount + 1);
            checkSearchLimit();
        }

        // [수정-ISO-B도면파일명]
        // ISO-B 데이터의 model 값(예: 06B-1, 08B-2)을 그대로 도면 파일명 기준으로 사용합니다.
        // '-' 앞의 06B는 형번, '-' 뒤의 1/2는 열수입니다.
        function getChainDrawingFileName(modelValue) {
            const model = String(modelValue || '').trim();
            if (!model) return '';
            return model.replace(/\s+/g, '');
        }

        function getIsoBStrandFolder(modelValue) {
            const strand = getStrandCount(modelValue);
            if (strand === '1') return 'BS1';
            if (strand === '2') return 'BS2';
            return '';
        }

        function buildIsoBDrawingPath(modelValue, drawingType, extension) {
            const drawingFileName = getChainDrawingFileName(modelValue);
            const strandFolder = getIsoBStrandFolder(modelValue);
            if (!drawingFileName || !strandFolder) return '';

            // C:\CSD\download\chain\ISO-B Roller chain_(BS)\BS1 또는 BS2 기준 상대경로
            return encodeURI(`../../../download/chain/ISO-B Roller chain_(BS)/${strandFolder}/${drawingType}/${drawingFileName}.${extension}`);
        }

        /* ===== 수정: DWG 인증 로직 - 스프라켓 파일과 동일한 인증코드 사용 ===== */
        const DWG_AUTH_CODE = 'hkd8421';

        const GOOGLE_FORM_URL  = 'https://docs.google.com/forms/d/e/1FAIpQLSeqElBNIHjkJhsIzNsH45j_cLnNm3lksRhlTtXKu_IfRLgFOg/formResponse';
        const FORM_ENTRY_NAME  = 'entry.1293161912';
        const FORM_ENTRY_EMAIL = 'entry.1030936526';

        /* 수정: Google Form에 '다운로드 파일명' 질문을 추가한 뒤,
           아래 entry 값을 해당 질문의 entry 번호로 교체하세요.
           예: const FORM_ENTRY_FILE  = 'entry.352673039'; */
        const FORM_ENTRY_FILE  = 'entry.352673039';

        let _pendingDwgUrl = null;

        /* 수정: 현재 다운로드 예정인 DWG 파일명 추출 */
        function getPendingDwgFileName() {
            if (!_pendingDwgUrl) return '';
            return _pendingDwgUrl.split('/').pop() || _pendingDwgUrl;
        }

        /* 수정: 현재 다운로드 예정인 DWG 경로까지 같이 기록하고 싶을 때 사용 */
        function getPendingDwgLogText() {
            const fileName = getPendingDwgFileName();
            return fileName ? `${fileName} | ${_pendingDwgUrl}` : '';
        }

        function requestDwgAuth(dwgUrl) {
            if (!dwgUrl) {
                alert('해당 형번의 DWG 도면파일이 준비되어 있지 않습니다.');
                return;
            }

            _pendingDwgUrl = dwgUrl;

            document.getElementById('authNameInput').value = '';
            document.getElementById('authEmailInput').value = '';
            document.getElementById('authCodeInput').value = '';
            document.getElementById('authStep1ErrorMsg').textContent = '';
            document.getElementById('authErrorMsg').textContent = '';
            document.getElementById('authNameInput').classList.remove('error');
            document.getElementById('authEmailInput').classList.remove('error');
            document.getElementById('authCodeInput').classList.remove('error');

            document.getElementById('authStep1').style.display = 'block';
            document.getElementById('authStep2').style.display = 'none';

            document.getElementById('authModalBackdrop').classList.add('active');
            setTimeout(() => document.getElementById('authNameInput').focus(), 120);
        }

        function closeAuthModal() {
            document.getElementById('authModalBackdrop').classList.remove('active');
            _pendingDwgUrl = null;
        }

        async function submitUserInfo() {
            const nameInput  = document.getElementById('authNameInput');
            const emailInput = document.getElementById('authEmailInput');
            const errMsg     = document.getElementById('authStep1ErrorMsg');
            const nextBtn    = document.getElementById('authStep1').querySelector('.auth-confirm-btn');
            const name  = nameInput.value.trim();
            const email = emailInput.value.trim();

            if (!name) {
                nameInput.classList.remove('error');
                void nameInput.offsetWidth;
                nameInput.classList.add('error');
                errMsg.textContent = '이름을 입력해 주세요.';
                nameInput.focus();
                return;
            }

            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                emailInput.classList.remove('error');
                void emailInput.offsetWidth;
                emailInput.classList.add('error');
                errMsg.textContent = '올바른 이메일 주소를 입력해 주세요.';
                emailInput.focus();
                return;
            }

            nameInput.classList.remove('error');
            emailInput.classList.remove('error');
            errMsg.textContent = '';

            nextBtn.disabled = true;
            nextBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 처리 중...';

            try {
                const formData = new FormData();
                formData.append(FORM_ENTRY_NAME, name);
                formData.append(FORM_ENTRY_EMAIL, email);
                /* 수정: 다운로드할 DWG 파일명/경로를 Google Sheet에 기록 */
                formData.append(FORM_ENTRY_FILE, getPendingDwgLogText());
                await fetch(GOOGLE_FORM_URL, { method: 'POST', mode: 'no-cors', body: formData });
            } catch (e) {
                // 네트워크 오류가 있어도 인증코드 입력 단계로 진행
            } finally {
                nextBtn.disabled = false;
                nextBtn.innerHTML = '<i class="fas fa-arrow-right"></i> 다음';
            }

            document.getElementById('authStep1').style.display = 'none';
            document.getElementById('authStep2').style.display = 'block';
            setTimeout(() => document.getElementById('authCodeInput').focus(), 120);
        }

        async function confirmAuth() {
            const input = document.getElementById('authCodeInput');
            const errMsg = document.getElementById('authErrorMsg');
            const confirmBtn = document.getElementById('authStep2').querySelector('.auth-confirm-btn');
            const entered = input.value.trim();

            if (entered !== DWG_AUTH_CODE) {
                input.classList.remove('error');
                void input.offsetWidth;
                input.classList.add('error');
                errMsg.textContent = '인증코드가 올바르지 않습니다.';
                input.value = '';
                input.focus();
                return;
            }

            confirmBtn.disabled = true;
            confirmBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 다운로드 중...';
            errMsg.textContent = '';

            try {
                /* 수정 : fetch 방식 제거 → 로컬모드 + 서버모드 모두 대응 */

                const fileName = _pendingDwgUrl.split('/').pop();

                const link = document.createElement('a');

                link.href = _pendingDwgUrl;

                link.download = fileName;

                /* 수정 : 새창 방지 */
                link.target = '_self';

                document.body.appendChild(link);

                link.click();

                document.body.removeChild(link);

                closeAuthModal();
            } catch (err) {
                errMsg.textContent = err.message || '다운로드 중 오류가 발생했습니다.';
                input.classList.remove('error');
                void input.offsetWidth;
                input.classList.add('error');
            } finally {
                confirmBtn.disabled = false;
                confirmBtn.innerHTML = '다운로드';
            }
        }
        /* ===== /수정: DWG 인증 로직 ===== */

        function displayResults(results, searchPitch = '', pitchTolerance = 5, searchModel = '', searchStrand = '') {
            const area = document.getElementById("resultArea");
            const middleVisual = document.getElementById("middleVisualZone");

            /* ===== 수정: 검색 후에도 중앙 체인 배경을 계속 표시 =====
               수정: 검색 결과가 있으면 숨기지 않고 search-active 클래스를 적용해 추천 크기로 축소합니다. */
            if (middleVisual) {
                if (results && results.length > 0) {
                    middleVisual.classList.add('search-active');
                    middleVisual.classList.remove('is-hidden');
                } else {
                    middleVisual.classList.remove('search-active');
                    middleVisual.classList.remove('is-hidden');
                }
            }

            if (!results || results.length === 0) {
                area.innerHTML = "<p style='text-align:center; padding:20px;'>검색 결과 없음</p>";
                return;
            }

            // [수정-형번열수분리입력] 검색 조건을 결과 상단 안내문에 표시
            const modelText = searchModel ? ` / 형번 ${searchModel}` : '';
            const strandText = searchStrand ? ` / ${searchStrand}열` : '';
            const toleranceText = searchPitch
                ? ` / 피치 ${searchPitch}mm 기준 ±${pitchTolerance} 범위`
                : '';

            let html = `
                <div class="result-summary">
                    아래 결과 영역만 스크롤됩니다. 한 화면에 5개씩 표시되며, 아래로 넘기면 다음 항목이 보입니다.<br>
                    총 ${results.length}건${modelText}${strandText}${toleranceText}
                </div>
            `;

            results.forEach((item, index) => {
                // [수정-ISO-B도면경로]
                // PDF/DWG/3D 경로는 열수에 따라 BS1, BS2 폴더로 분기합니다.
                const pdfPath = buildIsoBDrawingPath(item.model, 'PDF', 'pdf');
                const dwgPath = buildIsoBDrawingPath(item.model, 'DWG', 'dwg');

                // 3D 도면 경로는 아래처럼 준비해 두되, 자료 준비 전이므로 버튼은 준비중 알림으로 유지합니다.
                const threeDPath = buildIsoBDrawingPath(item.model, '3d', 'step');

                // [수정-검색결과자동펼침해제]
                // 검색 직후 첫 번째 카드가 자동으로 펼쳐지지 않도록 모든 결과를 접힌 상태로 표시합니다.
                const openClass = '';
                const iconClass = 'fa-chevron-down';

                html += `
                    <div class="result-card${openClass}">
                        <div class="result-top">
                            <div class="result-model">${item.model}</div>

                            <!-- 수정: 결과 상단에는 피치만 표시 -->
                            <div class="result-spec">
                                <div>피치</div>
                                <strong>${normalizeNumber(item.pitch)}<span class="result-unit">mm</span></strong>
                            </div>

                            <!-- 수정: 결과 상단에서 롤러경/핀경 표시 제거 -->

                            <button class="toggle-result-btn" type="button" onclick="toggleResultCard(this)" aria-label="상세 보기">
                                <i class="fas ${iconClass}"></i>
                            </button>
                        </div>

                        <div class="result-detail">
                            <div class="detail-grid">
                                <div class="detail-row">
                                    <span>ANSI No.</span>
                                    <strong>${item.ansiNo || '-'}</strong>
                                </div>
                                <div class="detail-row">
                                    <span>ISO No.</span>
                                    <strong>${item.isoNo || '-'}</strong>
                                </div>
                                <div class="detail-row">
                                    <span>내폭(W)</span>
                                    <strong>${normalizeNumber(item.innerWidth)} mm</strong>
                                </div>
                                <div class="detail-row">
                                    <span>플레이트 두께(t)</span>
                                    <strong>${normalizeNumber(item.plateThickness)} mm</strong>
                                </div>
                                <div class="detail-row">
                                    <span>플레이트 높이(H1)</span>
                                    <strong>${normalizeNumber(item.plateHeightH1)} mm</strong>
                                </div>
                                <div class="detail-row">
                                    <span>플레이트 높이(H2)</span>
                                    <strong>${normalizeNumber(item.plateHeightH2)} mm</strong>
                                </div>
                            </div>

                            <div class="result-buttons">
                                <a href="${pdfPath}" class="pdf-btn" target="_blank">PDF</a>
                                <!-- 수정: DWG 도면만 인증절차 후 다운로드 -->
                                <a href="javascript:void(0)" class="dwg-btn" onclick="requestDwgAuth('${dwgPath}')">2D도면</a>
                                <!-- 수정: 3D 도면은 아직 준비 전 -->
                                <a href="javascript:void(0)" class="dxf-btn" onclick="alert('3D 도면파일은 아직 준비되어 있지 않습니다.')">3D도면</a>
                            </div>
                        </div>
                    </div>
                `;
            });

            area.innerHTML = html;
        }

        function toggleResultCard(btn) {
            const card = btn.closest('.result-card');
            if (!card) return;

            card.classList.toggle('open');

            const icon = btn.querySelector('i');
            if (icon) {
                icon.classList.toggle('fa-chevron-down', !card.classList.contains('open'));
                icon.classList.toggle('fa-chevron-up', card.classList.contains('open'));
            }
        }

        function clearFields() {
            document.getElementById('searchModel').selectedIndex = 0;
            if (document.getElementById('searchStrand')) document.getElementById('searchStrand').value = '1';
            document.querySelectorAll('input').forEach(i => i.value = '');
            // [수정-피치오차범위고정값]
            // 피치 오차범위 입력창은 제거되었고 검색 오차는 절대값 ±5 고정이므로,
            // 초기화 시 별도로 복원할 입력값이 없습니다.
            document.getElementById('resultArea').innerHTML = '<div class="placeholder-text"></div>';

            const middleVisual = document.getElementById("middleVisualZone");
            if (middleVisual) {
                /* 수정: 초기화 시 중앙 체인 배경을 검색 전 큰 크기로 복귀 */
                middleVisual.classList.remove('search-active');
                middleVisual.classList.remove('is-hidden');
            }
        }

        function resetSearchLimit() {
            setSearchCount(0);
            checkSearchLimit();
            toggleMenu();
        }
    </script>
    <script>
        /* [수정-피치입력커서/검색버튼안정화]
           - 화면이 열리면 피치 입력칸에 기본 포커스
           - 값이 없을 때만 굵은 깜박임 커서와 안내 문구 표시
           - 기존 performSearch() 함수와 검색 버튼 동작은 건드리지 않음 */
        (function () {
            function setupPitchInputGuide() {
                var pitchInput = document.getElementById('searchPitch');
                if (!pitchInput) return;

                var pitchWrap = pitchInput.closest('.pitch-input-wrap');

                function updateState() {
                    if (!pitchWrap) return;
                    var isFocused = document.activeElement === pitchInput;
                    var isEmpty = String(pitchInput.value || '').trim() === '';
                    pitchWrap.classList.toggle('is-focused', isFocused);
                    pitchWrap.classList.toggle('is-empty', isEmpty);
                    pitchWrap.classList.toggle('has-value', !isEmpty);
                }

                setTimeout(function () {
                    try {
                        pitchInput.focus();
                        pitchInput.select();
                    } catch (e) {}
                    updateState();
                }, 120);

                pitchInput.addEventListener('focus', function () {
                    updateState();
                    /* [수정-피치값쉽게삭제]
                       피치 입력칸을 다시 선택하면 기존 값을 전체 선택하여
                       Del/Backspace 또는 새 숫자 입력으로 쉽게 지울 수 있게 했습니다. */
                    setTimeout(function () {
                        try { pitchInput.select(); } catch (e) {}
                    }, 0);
                });
                pitchInput.addEventListener('blur', updateState);
                pitchInput.addEventListener('input', updateState);
                pitchInput.addEventListener('change', updateState);

                updateState();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', setupPitchInputGuide);
            } else {
                setupPitchInputGuide();
            }
        })();
    </script>

</body>
