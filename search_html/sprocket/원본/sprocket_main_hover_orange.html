<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스프라켓 검색</title>

<style>
:root {
    --accent-main: #3f3f8f;
    --accent-soft: rgba(63,63,143,0.15);
    --accent-border: rgba(63,63,143,0.35);

    --bg-top: #e6e8ff;
    --bg-bottom: #d4d8f5;

    --text-main: #141733;
    --text-sub: rgba(20,23,51,0.7);

    --panel-bg: rgba(63,63,143,0.08);
    --panel-border: rgba(63,63,143,0.22);

    --btn-bg: rgba(63,63,143,0.16);
    --btn-border: rgba(63,63,143,0.28);

    --btn-hover-bg: var(--accent-main);
    --btn-hover-text: #ffffff;

    --home-btn-bg: rgba(63,63,143,0.12);
    --home-btn-border: rgba(63,63,143,0.35);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: sans-serif;
    background:
        radial-gradient(circle at top, rgba(63,63,143,0.25), transparent 55%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    display: flex;
    justify-content: center;
}

.page {
    max-width: 800px;
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 24px 18px;
}

.hero-header {
    text-align: center;
    margin-bottom: 30px;
}

.brand-tag {
    display: inline-block;
    padding: 6px 18px;
    border-radius: 999px;
    background: var(--accent-soft);
    border: 1px solid var(--accent-border);
    color: var(--accent-main);
    font-weight: 700;
    font-size: 0.9rem;
}

.main-title {
    margin: 10px 0 6px;
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--text-main);
}

.main-sub {
    color: var(--text-sub);
    font-size: 0.9rem;
}

.menu-panel {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 16px;
    box-shadow: 0 10px 30px rgba(63,63,143,0.10);
}

.mode-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.mode-btn {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px;
    border-radius: 16px;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    cursor: pointer;
    transition: all 0.25s ease;
    color: var(--text-main);
}

.mode-btn:hover {
    background: var(--btn-hover-bg);
    color: var(--btn-hover-text);
    transform: translateY(-4px);
    box-shadow: 0 18px 36px rgba(63,63,143,0.3);
}

.mode-btn.active {
    background: rgba(63,63,143,0.24);
    border-color: rgba(63,63,143,0.42);
}

.mode-btn:hover .mode-desc {
    color: rgba(255,255,255,0.88);
}

.image-wrap {
    width: 60px;
    height: 60px;
    border-radius: 12px;
    background: rgba(255,255,255,0.28);
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.45);
    flex-shrink: 0;
}

.mode-image {
    width: 48px;
    height: 48px;
    object-fit: contain;
    transition: all 0.25s ease;
    filter: brightness(0.92) contrast(1.08) saturate(0.9);
}

.mode-btn:hover .mode-image {
    filter: brightness(1.22) contrast(1.15) saturate(1.08);
    transform: scale(1.04);
}

/* 메뉴 버튼 hover 상태에서 아이콘 배경 박스를 밝은 주홍색으로 변경 */
.mode-btn:hover .image-wrap {
    background: #ffb36b;
}

.cv-image {
    filter: brightness(0.88) contrast(1.12) saturate(0.82);
}

.mode-title {
    font-weight: 700;
    font-size: 1.05rem;
    line-height: 1.25;
}

.mode-desc {
    font-size: 0.85rem;
    color: var(--text-sub);
    margin-top: 4px;
    transition: color 0.25s ease;
}

.middle-image-zone {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

.page-bg-image {
    width: 260px;
    opacity: 0.1;
}

.bottom-area {
    margin-top: auto;
    text-align: center;
}

.home-btn {
    margin-top: 10px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid var(--home-btn-border);
    background: var(--home-btn-bg);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s ease;
    color: var(--accent-main);
}

.home-btn:hover {
    background: var(--accent-main);
    color: #fff;
}

.bottom-brand {
    margin-top: 14px;
}

.bottom-brand-name {
    font-weight: 800;
    color: var(--accent-main);
}

.bottom-sub {
    font-size: 0.8rem;
    color: var(--text-sub);
}


/* =========================
   준비중 팝업 / 진행바
   ========================= */
.ready-popup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.28);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

.ready-popup-overlay.show {
    display: flex;
}

.ready-popup {
    width: 268px;
    padding: 25px 20px 23px;
    border-radius: 24px;
    background: rgba(248, 250, 255, 0.98);
    border: 1px solid rgba(63, 63, 143, 0.18);
    box-shadow: 0 18px 44px rgba(0, 0, 0, 0.18);
    text-align: center;
    position: relative;
    animation: readyPopupIn 0.18s ease-out;
}

@keyframes readyPopupIn {
    from {
        opacity: 0;
        transform: translateY(8px) scale(0.96);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.ready-close {
    position: absolute;
    top: 9px;
    right: 10px;
    width: 27px;
    height: 27px;
    border: 0;
    border-radius: 50%;
    background: rgba(63, 63, 143, 0.10);
    color: #3f3f8f;
    font-size: 19px;
    line-height: 27px;
    cursor: pointer;
}

.ready-close:hover {
    background: rgba(63, 63, 143, 0.18);
}

.ready-title {
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
    font-size: 1.35rem;
    font-weight: 900;
    color: #3f3f8f;
    letter-spacing: -0.04em;
    margin: 0 0 20px;
}

.progress-bar {
    width: 185px;
    height: 14px;
    margin: 0 auto;
    border-radius: 999px;
    background: rgba(214, 220, 235, 0.95);
    overflow: hidden;
    position: relative;
    box-shadow:
        inset 0 1px 2px rgba(255,255,255,0.75),
        inset 0 -1px 2px rgba(0,0,0,0.08);
}

.progress-runner {
    position: absolute;
    top: 2px;
    left: -74px;
    width: 74px;
    height: 10px;
    border-radius: 999px;
    background: linear-gradient(
        90deg,
        #ff4b4b 0%,
        #4f8cff 35%,
        #ff9f1c 70%,
        #ff4b4b 100%
    );
    background-size: 220% 100%;
    animation:
        progressMove 3.6s linear infinite,
        progressColorCycle 1.8s linear infinite;
}

.progress-runner::after {
    content: '';
    position: absolute;
    left: 8px;
    top: 2px;
    width: 24px;
    height: 2px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.72);
}

@keyframes progressMove {
    0% {
        left: -74px;
    }
    100% {
        left: 185px;
    }
}

@keyframes progressColorCycle {
    0% {
        background-position: 0% 50%;
    }
    100% {
        background-position: 220% 50%;
    }
}

.ready-text {
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
    margin: 20px 0 0;
    font-size: 0.83rem;
    font-weight: 500;
    color: rgba(20, 23, 51, 0.72);
    letter-spacing: -0.03em;
}

</style>
</head>

<body>
<div class="page">

    <div class="hero-header">
   
        <div class="main-title">유형별 스프라켓 검색</div>
      
    </div>

    <div class="menu-panel">
        <div class="mode-list">

            <!-- 동력전달용: 업로드한 sprocket-A.html로 이동 -->
            
            <div class="mode-btn" onclick="selectAndGo(this, './sprocket-A.html')">
                <div class="image-wrap">
                    <img src="../../images/sprocket.png" class="mode-image" alt="동력전달용 스프라켓">
                </div>
                <div>
                    <div class="mode-title">동력전달용 체인 스프라켓  </div>
                    <div class="mode-desc">ISO A 계열 (ANSI 규격 기반)</div>
                </div>
            </div>

            <!-- 동력전달용 체인 스프라켓(미업로드) sprocket-B.html로 이동 -->

            <div class="mode-btn" onclick="selectAndGo(this, './sprocket-B.html')">
                <div class="image-wrap">
                    <img src="../../images/sprocket.png" class="mode-image" alt="동력전달용 스프라켓">
                </div>
                <div>
                    <div class="mode-title">BS규격 체인 스프라켓  </div>
                    <div class="mode-desc">  ISO B 계열 (BS 규격 기반)  </div>
                </div>
            </div>

            <!-- 컨베이어용 -->
            <div class="mode-btn" onclick="showReadyPopup(this)">
                <div class="image-wrap">
                    <img src="../../images/cv_sprocket.png" class="mode-image cv-image" alt="컨베이어용 스프라켓">
                </div>
                <div>
                    <div class="mode-title">컨베이어용 체인스프라켓</div>
                    <div class="mode-desc">배속체인스프라켓/ 대형컨베이어체인스프라켓/ </div>
                </div>
            </div>

        </div>
    </div>

    <div class="middle-image-zone">
        <img src="../../images/sprocket.png" class="page-bg-image" alt="스프라켓 배경 이미지">
    </div>

    <div class="bottom-area">
        <div class="home-btn" onclick="goHome()">🏠 홈으로</div>

        <div class="bottom-brand">
            <div class="bottom-brand-name">MYCAD</div>
            <div class="bottom-sub">Speed &amp; Simple Data Search</div>
        </div>
    </div>

</div>

<script>
function selectAndGo(el, url) {
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.remove('active');
    });

    el.classList.add('active');

    setTimeout(() => {
        window.location.href = url;
    }, 150);
}

function goHome() {
    window.location.href = '../../index.html';
}

function showReadyPopup(el) {
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.remove('active');
    });

    if (el) {
        el.classList.add('active');
    }

    const popup = document.getElementById('readyPopup');
    if (popup) {
        popup.classList.add('show');
    }
}

function hideReadyPopup() {
    const popup = document.getElementById('readyPopup');
    if (popup) {
        popup.classList.remove('show');
    }
}

function closeReadyPopup(event) {
    if (event.target && event.target.id === 'readyPopup') {
        hideReadyPopup();
    }
}

document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
        hideReadyPopup();
    }
});

</script>


<!-- 준비중 팝업 -->
<div id="readyPopup" class="ready-popup-overlay" onclick="closeReadyPopup(event)">
    <div class="ready-popup" role="dialog" aria-modal="true" aria-labelledby="readyPopupTitle">
        <button class="ready-close" type="button" onclick="hideReadyPopup()" aria-label="닫기">×</button>

        <div id="readyPopupTitle" class="ready-title">준비중입니다</div>

        <div class="progress-bar" aria-hidden="true">
            <div class="progress-runner"></div>
        </div>

        <div class="ready-text">현재 해당 컨텐츠를 준비중입니다!</div>
    </div>
</div>

</body>
</html>
